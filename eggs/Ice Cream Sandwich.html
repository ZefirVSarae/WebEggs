    font-size: 17px;
    color: #fff;
  }
  /* ---------- Stage 2 : Nyandroid ---------- */
  #nyandroid-screen {
    position: fixed; inset: 0;
    background: #003366;               /* Board.setBackgroundColor(0xFF003366) */
    display: none;
    cursor: pointer;
  }
  #nyboard { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>

<div id="platlogo-screen">
<img id="droid" draggable="false" src="data:image/webp;base64,UklGRuIAAABXRUJQVlA4TNYAAAAvP8FPEC+gIAABRE3y1GA3CLJtRjOVWdzf4gTZNhvWME/8+Q8AwP86rcSBo7aRBGkohMJSWApDYfmDqdZ0q3f2V3cT0f8JGOf/5//+nY6/C9DZET1DYKd+D73fujIXqfdxlG5lNZjq49CZXUFTaAptEaKjrXt7Y82laBCiFi6kNIWm0BYs2rp0Td+aWpeHptAU6vwoDd5Ycynq6NCZ3Q+LVu/Rq/ejNWl0tPVnIaWbQqeiPi4d3G+tod7Whex07NmfpYPZMRhf/P9eSMfx7f7s/P/83z4D"
  alt="Android Ice Cream Sandwich platlogo"
  style="width:min(60vmin,220px);height:auto;image-rendering:pixelated;transform:rotate(-90deg)">
</div>

<div id="toast"><div class="msg">Android 4.0: Ice Cream Sandwich</div></div>

<div id="nyandroid-screen">
  <canvas id="nyboard"></canvas>

<script>
"use strict";
/* =========================================================
 * Stage 1 — PlatLogoActivity
 * ========================================================= */
var LONG_PRESS_TIMEOUT = 500;   /* ViewConfiguration.getLongPressTimeout() */
var platScreen = document.getElementById("platlogo-screen");
var droid = document.getElementById("droid");
var toast = document.getElementById("toast");
var mCount = 0;
var holdTimer = null;

function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

/* mSuperLongPress: count++, vibrate(50*count), scale=1+0.25*count^2,
   repeat every LONG_PRESS_TIMEOUT; after count>3 -> Nyandroid */
function superLongPress() {
  mCount++;
  buzz(50 * mCount);
  var scale = 1 + 0.25 * mCount * mCount;
  droid.style.transform = "rotate(-90deg) scale(" + scale + ")";
  if (mCount <= 3) {
    holdTimer = setTimeout(superLongPress, LONG_PRESS_TIMEOUT);
  } else {
    startNyandroid();
  }
}

/* ACTION_DOWN: removeCallbacks, mCount=0, postDelayed(2*LONG_PRESS_TIMEOUT) */
platScreen.addEventListener("pointerdown", function () {
  mCount = 0;
  droid.style.transform = "rotate(-90deg) scale(1)";
  clearTimeout(holdTimer);
  holdTimer = setTimeout(superLongPress, 2 * LONG_PRESS_TIMEOUT);
});

/* ACTION_UP: if pressed -> removeCallbacks, mToast.show() */
platScreen.addEventListener("pointerup", function () {
  clearTimeout(holdTimer);
  toast.classList.add("show");
  clearTimeout(platScreen._t);
  platScreen._t = setTimeout(function () { toast.classList.remove("show"); }, 2000);
  droid.style.transform = "rotate(-90deg) scale(1)";
});
platScreen.addEventListener("pointerleave", function () {
  clearTimeout(holdTimer);
  droid.style.transform = "rotate(-90deg) scale(1)";
});
platScreen.addEventListener("contextmenu", function (e) { e.preventDefault(); });

/* =========================================================
 * Stage 2 — Nyandroid.Board
 * Simulates a 480dpi screen: SIM px = 3 device px, 1 CSS px = 3 SIM px.
 * ========================================================= */
var D = 3;
var NUM_CATS = 20;
var NUM_STARS = 20;
var VMIN = 100.0, VMAX = 1000.0;

var NY_FRAMES = ["data:image/webp;base64,UklGRgIBAABXRUJQVlA4TPUAAAAvP8FPEC+gIAABRE3y1GA3CLJtRjOVWdzf4gTZNhvWME/8+Q8AwP86rcSBq8h268YUDoVQCAVRKH8wV6OrvPqlTCL6PwHr+//3/5ke9+WA1nDRVwI0zvgiQGsPBw996N5K6+4mUaSYUBzrKPac0qqioRMdxdAKaqEWelSKrguOZmi4lStam6JJio51FC3UQo+iONalFJf2nNfqnejsCmqhFvoOQDG5orUpOttRDL0VimMdGm7y0+3cP7VsdJ17XKN4P2goOselFJcm+1UtikspDnO93OS68fmstyfcZD32aIbGGV8YcNdjz2cpreuvnM++/3/+BgA=","data:image/webp;base64,UklGRuIAAABXRUJQVlA4TNYAAAAvP8FPEC+gIAABRE3y1GA3CLJtRjOVWdzf4gTZNhvWME/8+Q8AwP86rcSBo7aRBGkohMJSWApDYfmDqdZ0q3f2V3cT0f8JGOf/5//+nY6/C9DZET1DYKd+D73fujIXqfdxlG5lNZjq49CZXUFTaAptEaKjrXt7Y82laBCiFi6kNIWm0BYs2rp0Td+aWpeHptAU6vwoDd5Ycynq6NCZ3Q+LVu/Rq/ejNWl0tPVnIaWbQqeiPi4d3G+tod7Whex07NmfpYPZMRhf/P9eSMfx7f7s/P/83z4D","data:image/webp;base64,UklGRvoAAABXRUJQVlA4TO4AAAAvP8FPEC+gIAABRE3y1GA3CLJtRjOVWdzf4gTZNhvWME/8+Q8AwP86rcQBo7aRJA2FUFgKS2EoLH8w1aruPV892oj+T8D4////v3+ndJmAzlKyC4Y0uiQIKV0X8KQNHmaA7nd1pkl9C4dOE/NR3GBqWxc6aApNoZcI0XHZ/izETN2xZlM0CNE+zsVMoSn0EpgNXlhz3ZraZg4zhabQFNr0odPEDO5Ysyna4IXPg9nRhZjOodu1D61Jo+Pa/ZmL+VDoVLSjC4O9lNI9W0N9WxdSOku54njm/ix9QjoYb9yfhZSuFWrJju/Zn/3//9UN","data:image/webp;base64,UklGRuIAAABXRUJQVlA4TNUAAAAvP8FPEC+gIAABRE3y1GA3CLJtRjOVWdzf4gTZNhvWME/8+Q8AwP86rcSBo7aRBGkohMJSWApDYfmDqdZ0q3f2V3cT0f8JGOf/5////9PxdwE6O6JnCOzU76H3W1fmIvU+jtKtrAZTfRw6sytoCk2hLUJ0tHVvb6y5FA1C1MKFlKbQFNqCRVuXrulbU+vy0BSaQp0fpcEbay5FHR06s/th0eo9evV+tCaNjrb+LKR0U+hU1Melg/utNdTbupCdjj37s3QwOwbji//fC+k4vt2fnf8ffwMA","data:image/webp;base64,UklGRuAAAABXRUJQVlA4TNMAAAAvP8FPEC+gIAABRE3y1GA3CLJtRjOVWdzf4gTZNhvWME/8+Q8AwP86rcSBq0i26ggLYyEWYgEL8S/m3OLw/Lu7RPR/Asr9//3////M+LsArTOidwhsMulD31WD2kj/ZI6uu2gNqiZzaHVbUAu10FEhWubO3la0HkWDEM3jQrpaqIWOojG3s/vMa/VN9VALtdDMj67BitajaFqHVncrNOZ7nz5zf2rZaJk7Pwvpuh+0KprM2cG7qkX/3C5kk2Xj+Zkd1BmDcuL/90JmLGfPz+7/r78BAA==","data:image/webp;base64,UklGRuAAAABXRUJQVlA4TNMAAAAvP8FPEC+gIAABRE3y1GA3CLJtRjOVWdzf4gTZNhvWME/8+Q8AwP86rcSBozaSJKkpJIWhMBSawvIHk6XK6uuXsx3R/wlo9//3////Y8bvAnCfEfz9kHV+WLonUe/twO+qUjbo7OhQup8QSR8H7moGLIElcM3D4CC0eitKSNq6EKUSWAKPqnV0cs28XwNgCSyBax4GezuUBitKSNo6cFe3IiNp8H78zP3jAeDOZi5E6S5Qb+bk4F01yLY9+7MQS7cj+jM56DPeK4SYsZ3dn93/X38DAA==","data:image/webp;base64,UklGRvgAAABXRUJQVlA4TOwAAAAvP8FPEC+gIAABRE3y1GA3CLJtRjOVWdzf4gTZNhvWME/8+Q8AwP86rcSBq8h268YUDoVQCAVRKH8wV6OrvPqlTCL6PwHr+//3/5ke9+WA1nDRVwI0zvgiQGsPBw996N5K6+4mUaR/rKPYc0qrmoROdBRDK6iFWuhRKcU5Dg23ckVrUzRJZzuKFmqhR1Ec61KKS3vOa/VOdHYFtVALfQegmFzR2hSd7SiG3grFsQ4NN/npdu6fWjbFsY7i/aChw1xKcWmyX9Wif5jr5SbXjc9nvT3hJuuxRzM0zvjCgLseez5LaV1/5Xz2/f/zNw==","data:image/webp;base64,UklGRt4AAABXRUJQVlA4TNEAAAAvP8FPEC+gIAABRE3y1GA3CLJtRjOVWdzf4gTZNhvWME/8+Q8AwP86rcSBq9q2gogKp4IVrEAF+4e5b/EeoH93hoj+T0A7/z//9++s+LsA7SuiZwi8qd9D711H+iD1Po7SVxkNuvo4tGdH0BSaQpcIGTR4O9ZcigahjwspTaEpdAkGbV26Zt2aWpeHptAU6vwoDXasuRR1dGjPvg+DVu/Ra+1Ha9IMWriQ0pdCu5q5dHDvWkO9rQt50/bO/iwd9BWD9sX/74Ws2L7dn53/n//bZwA=","data:image/webp;base64,UklGRvYAAABXRUJQVlA4TOkAAAAvP8FPEC+gIAABRE3y1GA3CLJtRjOVWdzf4gTZNhvWME/8+Q8AwP86rcQBo7aRJA2FUFgKS2EoLH8w1aruPV892oj+T8D4////v3+ndJmAzlKyC4Y0uiQIKV0X8KQNHmaA7nd1pkl9C4dOE/NR3GBqWxc6aApNoZcIMVu4EDN1x5pN0SBs5lzMFJpCL4HZ4IU1162pbeYwU2gKTaFNHzpNzOCONZuiDV74PJgdXYjpHLpd+9CaNGYf52I+FDq1rQuDvZTSPVtDfVsXUjpLueJ45v4sfUI6GG/cn4WUrhVqyY7v2Z/9///VDQA=","data:image/webp;base64,UklGRtwAAABXRUJQVlA4TNAAAAAvP8FPEC+gIAABRE3y1GA3CLJtRjOVWdzf4gTZNhvWME/8+Q8AwP86rcSBozaSJKkpBIWhMBSawvAHk6Wjr1/tdkT/J6Dd/9/////PjL8L0D4jeofATus99F3V053k13GkbsVrdK3j0B71oCE0hE5h4izwVsx5FDXMOs4kNYSG0ClwlnXhnHlzcqs8NISG0MqPVGPFnEfRig7t0f3gLPU+feb+NCeMs4QzSd0U2rWYCxvvqjnkl3UmO217rs/CRp/RaCf+f89kxnb2+uz+//ob","data:image/webp;base64,UklGRtQAAABXRUJQVlA4TMgAAAAvP8FPEC+gIAABRE3y1GA3CLJtRjOVWdzf4gTZNhvWME/8+Q8AwP86rcSBq8h268YUDoVSCAVRCH8wV2PJrz+ljuj/BLT7//v///+Z8bsAtRnROwQ2WfShz6qOdZJfzJG6i17HtJhDLdqDhtAQOsqls8pbMQd13GLOJTWEhtBvgHDOvDnhUg8NoSG08iPVWTEHLetQi35EvPqb+9WcXjrrOJfU/aCmFV3YeVYNkV/buWyybbw+Czs2o9NO/P+ey4zt7PXZ/f/1Nw==","data:image/webp;base64,UklGRtgAAABXRUJQVlA4TMwAAAAvP8FPEC+gIAABRE3y1GA3CLJtRjOVWdzf4gTZNhvWME/8+Q8AwP86rcSBozaSJKkpJIWlMBSKwvAHk6XKPn852xH9n4B2/3////8/ZvwuAMeM4O+HqvPD0lFEf28HflaVqkmwo0PX/aQo+jhwqBWwBJbAA8BJavVW9HspukpgCTyF7OjkPvN+DYAlsAQeAPZ26Jqs6PfAoe6niqLBe/k398sDwMFmLkXXXaC/mZOTZ9Wk2vbsz1Is3Y7oz+QkZrxXSDFjO7s/u/+//gY="];
var NY_FRAME_MS = 80;            /* i_nyandroid_anim.xml duration */
var STAR_FRAMES = ["data:image/webp;base64,UklGRiAAAABXRUJQVlA4TBMAAAAvRUAREAcQEREAEsL/+VJE/1M6AA==","data:image/webp;base64,UklGRjAAAABXRUJQVlA4TCMAAAAvRUAREA8w//M///Mf8FDTtgFT/qjKrATmGdH/CcAfKV9XBAA=","data:image/webp;base64,UklGRjoAAABXRUJQVlA4TC4AAAAvRUAREA8w//M///Mf8FDUtg1UacBGvZDG4H5We0f0fwLwdaascKSJAhO3oIcD","data:image/webp;base64,UklGRjwAAABXRUJQVlA4TDAAAAAvRUAREA8w//M///Mf8FDTRpIzDA7SUT9g4WO5ujqi/xOA9ljzyuWsZZIgFv9RyQY=","data:image/webp;base64,UklGRj4AAABXRUJQVlA4TDEAAAAvRUAREA8w//M///Mf8FDcNoqUDiiJ1qcwJNjjOeId0f8JANT8V2W7O9RUpyG8q9cFAA==","data:image/webp;base64,UklGRkYAAABXRUJQVlA4TDoAAAAvRUAREA8w//M///Mf8FDUtpEUaQEMpKU+kBbAfTwDIKL/EwDk4q/TA+ihJL7Kp1UhzHsAPZQgF38b"];
var STAR_FRAME_MS = 200;         /* i_star_anim.xml duration */

var nyScreen = document.getElementById("nyandroid-screen");
var board = document.getElementById("nyboard");
var ctx = board.getContext("2d");

function lerp(a, b, f) { return (b - a) * f + a; }
function randfrange(a, b) { return lerp(a, b, Math.random()); }

var boardWidth = 0, boardHeight = 0;
var stars = [], cats = [];
var running = false, lastFrame = 0;

/* pre-load animation frames; natural size = device px at 480dpi */
function loadFrames(arr) {
  return arr.map(function (src) {
    var im = new Image();
    im.src = src;
    return im;
  });
}
var nyImgs = loadFrames(NY_FRAMES);
var starImgs = loadFrames(STAR_FRAMES);

function Star() {
  this.scale = randfrange(0.1, 1);
  this.x = randfrange(0, boardWidth);
  this.y = randfrange(0, boardHeight);
  this.startDelay = randfrange(0, 1000);   /* postDelayed(rand(0,1000), start) */
  this.w = starImgs[0].width;
  this.h = starImgs[0].height;
  this.frame = 0;
  this.frameTime = 0;
}

function FlyingCat(z) {
  this.z = z;
  this.w = nyImgs[0].width;
  this.h = nyImgs[0].height;
  this.startDelay = randfrange(0, 1000);
  this.reset(true);
  this.x = randfrange(0, boardWidth);      /* initial random position */
  this.startDelay = randfrange(0, 1000);
}

FlyingCat.prototype.reset = function (keepDelay) {
  this.scale = lerp(0.1, 2, this.z);
  this.x = -this.scale * this.w + 1;
  this.y = randfrange(0, boardHeight - this.scale * this.h);
  this.v = lerp(VMIN, VMAX, this.z);
  this.dist = 0;
};

FlyingCat.prototype.update = function (dt) {
  this.dist += this.v * dt;
  this.x += this.v * dt;
};

function resizeBoard() {
  var dpr = window.devicePixelRatio || 1;
  board.width = Math.round(nyScreen.clientWidth * dpr);
  board.height = Math.round(nyScreen.clientHeight * dpr);
  ctx.setTransform(dpr / D, 0, 0, dpr / D, 0, 0);
  boardWidth = nyScreen.clientWidth * D;
  boardHeight = nyScreen.clientHeight * D;
}
window.addEventListener("resize", function () { if (running) { resizeBoard(); reset(); } });

function reset() {
  stars = [];
  for (var i = 0; i < NUM_STARS; i++) stars.push(new Star());
  cats = [];
  for (var i = 0; i < NUM_CATS; i++) {
    var nv = new FlyingCat((i / NUM_CATS) * (i / NUM_CATS));
    cats.push(nv);
  }
}

function frame(t) {
  if (!running) return;
  var dt = Math.min((t - lastFrame) / 1000, 0.05);
  lastFrame = t;

  ctx.clearRect(0, 0, boardWidth, boardHeight);

  /* fixed stars (FIXED_STARS) */
  for (var i = 0; i < stars.length; i++) {
    var s = stars[i];
    var st = t - s.startDelay;
    if (st < 0) continue;
    s.frame = Math.floor(st / STAR_FRAME_MS) % STAR_FRAMES.length;
    var img = starImgs[s.frame];
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.scale(s.scale, s.scale);
    ctx.drawImage(img, -s.w / 2, -s.h / 2, s.w, s.h);
    ctx.restore();
  }

  /* flying cats */
  for (var i = 0; i < cats.length; i++) {
    var nv = cats[i];
    var ct = t - nv.startDelay;
    if (ct < 0) continue;
    nv.update(dt);
    var catWidth = nv.w * nv.scale, catHeight = nv.h * nv.scale;
    if (nv.x + catWidth < -2 || nv.x > boardWidth + 2 ||
        nv.y + catHeight < -2 || nv.y > boardHeight + 2) {
      nv.reset();
    }
    nv.frame = Math.floor(ct / NY_FRAME_MS) % NY_FRAMES.length;
    var img = nyImgs[nv.frame];
    ctx.save();
    ctx.translate(nv.x + catWidth / 2, nv.y + catHeight / 2);
    ctx.scale(nv.scale, nv.scale);
    ctx.drawImage(img, -nv.w / 2, -nv.h / 2, nv.w, nv.h);
    ctx.restore();
  }
  requestAnimationFrame(frame);
}

/* onUserInteraction -> finish(): any tap returns to the platlogo */
nyScreen.addEventListener("pointerdown", function () {
  running = false;
  nyScreen.style.display = "none";
  platScreen.style.display = "flex";
});

function startNyandroid() {
  clearTimeout(holdTimer);
  platScreen.style.display = "none";
  nyScreen.style.display = "block";
  resizeBoard();
  reset();
  running = true;
  lastFrame = performance.now();
  requestAnimationFrame(frame);
}
</script>
