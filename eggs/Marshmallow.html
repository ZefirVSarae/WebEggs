<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Android 6</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  *{box-sizing:border-box}
  .screen{position:fixed;inset:0;display:none}
  .screen.on{display:block}

  /* ---------- PlatLogo ---------- */
  #logo-screen{background:#000}
  #mlogo{position:absolute;left:50%;top:50%;width:var(--size);height:var(--size);
    margin-left:calc(var(--size)/-2);margin-top:calc(var(--size)/-2);
    border-radius:50%;cursor:pointer;z-index:2;opacity:0;
    transform:scale(0.5);transition:transform .5s cubic-bezier(0,0,.5,1) .8s,opacity .5s cubic-bezier(0,0,.5,1) .8s;}
  #mlogo.on{opacity:1;transform:scale(1)}
  #mlogo .bg,#mlogo .fg{position:absolute;inset:0;border-radius:50%}
  #mlogo .fg{background:conic-gradient(from 225deg,var(--fgc) 0deg 180deg,transparent 180deg 360deg)}
  #mlogo .mm{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat}
  #mlogo .fgm{position:absolute;inset:0;border-radius:50%;opacity:0;
    transition:opacity .3s cubic-bezier(0,0,.5,1);background-size:100% 100%;background-repeat:no-repeat}
  #mlogo.show .fgm{opacity:1}
  #mlogo .ripple{position:absolute;inset:0;border-radius:50%;pointer-events:none;
    background:radial-gradient(circle,rgba(255,255,255,.4) 20%,transparent 60%);opacity:0;transition:opacity .4s}
  #mlogo:active .ripple{opacity:1}

  /* ---------- MLand ---------- */
  #game-screen{background:#000;touch-action:none}
  #world{position:absolute;inset:0;overflow:hidden}
  #world>div{position:absolute}
  #touchcanvas{position:absolute;inset:0;z-index:50;pointer-events:none}
  #player-setup{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;
    align-items:center;z-index:100;pointer-events:none}
  #player-setup .pbtn{width:calc(48*var(--dp));height:calc(48*var(--dp));padding:calc(10*var(--dp));
    background-size:100% 100%;pointer-events:auto;cursor:pointer;display:none}
  #player-setup .pbtn.vis{display:block}
  #scores{display:flex;height:calc(64*var(--dp));padding:calc(12*var(--dp));gap:calc(4*var(--dp));
    clip-path:none}
  #scores .score{font-family:Roboto,Arial,sans-serif;font-weight:bold;
    font-size:calc(22*var(--dp));display:flex;align-items:center;justify-content:center;
    padding:calc(4*var(--dp)) calc(12*var(--dp));border-radius:calc(4*var(--dp));
    background:#fff;min-width:2em}
  #splash{position:absolute;inset:0;background:rgba(0,0,0,.63);z-index:90;
    display:none;align-items:center;justify-content:center;opacity:0;transition:opacity 1s}
  #splash.vis{display:flex}
  #splash.on{opacity:1}
  #playbtn{width:calc(72*var(--dp));height:calc(72*var(--dp));border-radius:50%;
    background:#aaa;display:flex;align-items:center;justify-content:center;cursor:pointer;
    position:relative;overflow:hidden}
  #playbtn:active{background:#ddd}
  #playimg{width:calc(48*var(--dp));height:calc(48*var(--dp));
    background:url('data:image/svg+xml;base64,PHN2ZyB4bWxucz0naHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmcnIHZpZXdCb3g9JzAgMCAyNC4wIDI0LjAnPjxwYXRoIGQ9J004LDVsMCwxNGwxMSwtN3onIGZpbGw9JyMwMDAwMDAnIGZpbGwtb3BhY2l0eT0nMS4wJy8+PHBhdGggZD0nTTAgMGgyNHYyNEgweicgZmlsbD0nIzAwMDAwMCcgZmlsbC1vcGFjaXR5PScwLjAnLz48L3N2Zz4=') no-repeat 0 0/100% 100%;transition:opacity .2s}
  #playtext{position:absolute;font-family:Roboto,Arial,sans-serif;color:#000;
    font-size:calc(40*var(--dp));opacity:0;transition:opacity .2s}
</style>
</head>
<body>

<!-- ============ SCREEN 1: PlatLogoActivity ============ -->
<div class="screen on" id="logo-screen">
  <div id="mlogo">
    <div class="bg"></div>
    <div class="fg"></div>
    <div class="mm" id="mm"></div>
    <div class="fgm" id="fgm"></div>
    <div class="ripple"></div>
  </div>
</div>

<!-- ============ SCREEN 2: MLandActivity ============ -->
<div class="screen" id="game-screen">
  <div id="world"></div>
  <canvas id="touchcanvas"></canvas>
  <div id="player-setup">
    <div class="pbtn" id="pminus" title="-"></div>
    <div id="scores"></div>
    <div class="pbtn" id="pplus" title="+"></div>
  </div>
  <div id="splash">
    <div id="playbtn"><div id="playimg"></div><div id="playtext">3</div></div>
  </div>
</div>

/* ================= PlatLogoActivity (Marshmallow) ================= */
(function(){
  function hsb(h,s,v){
    function f(n){
      var k=(n+h*6)%6;
      return v-v*s*Math.min(k,4-k,1);
    }
    var r=Math.round(f(5)*255),g=Math.round(f(3)*255),b=Math.round(f(1)*255);
    return "rgb("+r+","+g+","+b+")";
  }
  var screen=document.getElementById("logo-screen");
  var mlogo=document.getElementById("mlogo");
  var mm=document.getElementById("mm");
  var fgm=document.getElementById("fgm");
  var bg=mlogo.querySelector(".bg");
  var fg=mlogo.querySelector(".fg");
  var tapCount=0, pressTimer=null, longFired=false;

  function layout(){
    var dp=Math.min(window.innerWidth,window.innerHeight)/360;
    document.documentElement.style.setProperty("--dp",dp+"px");
    var size=Math.min(Math.min(window.innerWidth,window.innerHeight),600*dp)-100*dp;
    screen.style.setProperty("--size",size+"px");
  }
  layout();
  window.addEventListener("resize",layout);

  var hue=Math.random();
  bg.style.background=hsb(hue,0.4,1);
  mlogo.style.setProperty("--fgc",hsb(hue,0.5,1));
  mm.style.backgroundImage="url('"+SVGS.m_platlogo_m+"')";
  fgm.style.backgroundImage="url('"+SVGS.m_platlogo+"')";

  requestAnimationFrame(function(){mlogo.classList.add("on");}); // scale .5 -> 1, alpha -> 1

  function showMarshmallow(){
    mlogo.classList.add("show"); // m_platlogo overlay fades in over 300ms
  }
  function onClick(){
    if(tapCount===0)showMarshmallow();
    tapCount++;
  }
  function onLongClick(){
    if(tapCount<5)return false;
    document.getElementById("logo-screen").classList.remove("on");
    document.getElementById("game-screen").classList.add("on");
    MLand.init();
    return true;
  }
  mlogo.addEventListener("click",function(){if(!longFired)onClick();});
  mlogo.addEventListener("pointerdown",function(){
    pressTimer=setTimeout(function(){if(onLongClick()){longFired=true;mlogo.style.pointerEvents="none";}},600);
  });
  mlogo.addEventListener("pointerup",function(){clearTimeout(pressTimer);});
  mlogo.addEventListener("pointerleave",function(){clearTimeout(pressTimer);});

  var keyCount=0;
  window.addEventListener("keydown",function(e){
    if(e.repeat)return;
    e.preventDefault();
    if(keyCount===0)showMarshmallow();
    keyCount++;
    if(keyCount>2)onClick();
  });
})();

/* ================= MLand ================= */
var MLand=(function(){
  var P={TRANSLATION_PER_SEC:100,OBSTACLE_SPACING:380,BOOST_DV:550,PLAYER_HIT_SIZE:40,PLAYER_SIZE:40,
    OBSTACLE_WIDTH:130,OBSTACLE_STEM_WIDTH:8,OBSTACLE_GAP:140,OBSTACLE_MIN:48,
    BUILDING_WIDTH_MIN:50,BUILDING_WIDTH_MAX:250,BUILDING_HEIGHT_MIN:20,
    CLOUD_SIZE_MIN:10,CLOUD_SIZE_MAX:100,SUN_SIZE:45,STAR_SIZE_MIN:3,STAR_SIZE_MAX:5,
    G:30,MAX_V:1000,SCENERY_Z:6,OBSTACLE_Z:18,PLAYER_Z:18,PLAYER_Z_BOOST:20,HUD_Z:10};
  P.OBSTACLE_PERIOD=P.OBSTACLE_SPACING/P.TRANSLATION_PER_SEC; // 3.8 s
  if(P.OBSTACLE_MIN<=P.OBSTACLE_WIDTH/2)P.OBSTACLE_MIN=P.OBSTACLE_WIDTH/2+1;

  var SKIES=[[0xc0c0ff,0xa0a0ff],[0x000010,0x000000],[0x000040,0x000010],[0xa08020,0x204080]];
  var DAY=0,NIGHT=1,TWILIGHT=2,SUNSET=3;
  var SCENE_CITY=0,SCENE_TX=1,SCENE_ZRH=2,SCENE_COUNT=3;
  var ANTENNAE=["m_mm_antennae","m_mm_antennae2"];
  var EYES=["m_mm_eyes","m_mm_eyes2"];
  var MOUTHS=["m_mm_mouth1","m_mm_mouth2","m_mm_mouth3","m_mm_mouth4"];
  var CACTI=["m_cactus1","m_cactus2","m_cactus3"];
  var MOUNTAINS=["m_mountain1","m_mountain2","m_mountain3"];
  var COLORS=["#DB4437","#3B78E7","#F4B400","#0F9D58","#7B1880","#9E9E9E"];
  var MAX_PLAYERS=6,MIN_PLAYERS=1;

  var world,scoreRow,splash,dp,playing=false,animating=false,frozen=false,flipped=false;
  var lastPipeTime=0,pipeId=0,W=0,H=0,timeOfDay=0,scene=0,t=0;
  var players=[],obstacles=[],scenery=[],raf=null,prevMs=0,countdown=0,countTimer=null;

  function frand(){return Math.random();}
  function frand2(a,b){return (b-a)*frand()+a;}
  function irand(a,b){return Math.round(frand2(a,b));}
  function lerp(x,a,b){return (b-a)*x+a;}
  function rlerp(v,a,b){return (v-a)/(b-a);}
  function clamp(f){return f<0?0:f>1?1:f;}
  function pick(l){return l[irand(0,l.length-1)];}
  function px(v){return v*dp+"px";}
  function el(parent){var d=document.createElement("div");(parent||world).appendChild(d);return d;}
  function luma(hex){
    var n=parseInt(hex.slice(1),16);
    return 0.2126*((n>>16)&255)/255+0.7152*((n>>8)&255)/255+0.0722*(n&255)/255;
  }

  /* ---------- players ---------- */
  function Player(idx){
    var self=this;
    this.idx=idx;
    this.color=COLORS[idx];
    this.el=el();
    this.el.style.width=px(P.PLAYER_SIZE);this.el.style.height=px(P.PLAYER_SIZE);
    this.el.style.backgroundImage="url('"+SVGS["m_android_c"+idx]+"')";
    this.el.style.zIndex=P.PLAYER_Z;
    this.el.style.display="none";
    this.el.style.transformOrigin="50% 50%";
    this.x=P.PLAYER_SIZE;this.y=0;this.dv=0;this.boosting=false;
    this.alive=false;this.score=0;this.rot=0;this.touchX=-1;this.touchY=-1;
    // score field
    var sf=document.createElement("div");
    sf.className="score";
    sf.style.background=this.color;
    sf.style.color=luma(this.color)>0.7?"#000":"#fff";
    sf.textContent="0";
    scoreRow.appendChild(sf);
    this.sf=sf;
    this.step=function(dt){
      if(!this.alive){ // float away with the garbage
        this.x-=P.TRANSLATION_PER_SEC*dt;
        this.el.style.left=px(this.x);
        return;
      }
      if(this.boosting)this.dv=-P.BOOST_DV;
      else this.dv+=P.G*dt*60;
      if(this.dv<-P.MAX_V)this.dv=-P.MAX_V;else if(this.dv>P.MAX_V)this.dv=P.MAX_V;
      this.y=Math.max(0,this.y+this.dv*dt);
      this.rot=90+lerp(clamp(rlerp(this.dv,P.MAX_V,-P.MAX_V)),90,-90);
      this.place();
    };
    this.place=function(){
      this.el.style.left=px(this.x-P.PLAYER_SIZE/2);
      this.el.style.top=px(this.y-P.PLAYER_SIZE/2);
      var sc=(this.boosting?1.25:1);
      this.el.style.transform="scale("+sc+") rotate("+this.rot+"deg)";
    };
    this.reset=function(){
      this.y=H/2+(Math.random()*P.PLAYER_SIZE-P.PLAYER_SIZE/2);
      this.setScore(0);
      this.boosting=false;this.dv=0;this.alive=false;this.touchX=this.touchY=-1;
      this.place();
    };
    this.setScore=function(v){this.score=v;this.sf.textContent=String(v);};
    this.die=function(){this.alive=false;};
    this.corners=function(){
      var cur=this.boosting?1.25:1;
      var inset=(P.PLAYER_SIZE-P.PLAYER_HIT_SIZE)/2;
      var rot=this.rot*Math.PI/180;
      var cx=this.x,cy=this.y,out=[];
      for(var i=0;i<sHull.length/2;i++){
        var hx=sHull[i*2]*P.PLAYER_HIT_SIZE+inset-P.PLAYER_SIZE/2;
        var hy=sHull[i*2+1]*P.PLAYER_HIT_SIZE+inset-P.PLAYER_SIZE/2;
        out.push(cx+(hx*Math.cos(rot)-hy*Math.sin(rot))*cur,
                 cy+(hx*Math.sin(rot)+hy*Math.cos(rot))*cur);
      }
      return out;
    };
  }
  var sHull=[0.3,0, 0.7,0, 0.92,0.33, 0.92,0.75, 0.6,1, 0.4,1, 0.08,0.75, 0.08,0.33];

  function realignPlayers(){
    var N=players.length;
    var x=(W-(N-1)*P.PLAYER_SIZE)/2;
    for(var i=0;i<N;i++){players[i].x=x;x+=P.PLAYER_SIZE;if(!playing)players[i].place();}
  }
  function setupPlayers(n){
    while(players.length){var p=players.pop();if(p.el.parentNode)p.el.parentNode.removeChild(p.el);p.sf.remove();}
    for(var i=0;i<n;i++)players.push(new Player(players.length));
  }
  function addPlayer(){if(players.length==MAX_PLAYERS)return;players.push(new Player(players.length));realignPlayers();}
  function removePlayer(){if(players.length==MIN_PLAYERS)return;var p=players.pop();if(p.el.parentNode)p.el.parentNode.removeChild(p.el);p.sf.remove();realignPlayers();}

  /* ---------- init / reset ---------- */
  function init(){
    world=document.getElementById("world");
    scoreRow=document.getElementById("scores");
    splash=document.getElementById("splash");
    document.getElementById("pminus").style.backgroundImage="url('"+SVGS.m_minus+"')";
    document.getElementById("pplus").style.backgroundImage="url('"+SVGS.m_plus+"')";
    document.getElementById("pminus").addEventListener("click",function(){removePlayer();updateSetup();});
    document.getElementById("pplus").addEventListener("click",function(){addPlayer();updateSetup();});
    document.getElementById("playbtn").addEventListener("click",startButtonPressed);
    timeOfDay=irand(0,SKIES.length-1);scene=irand(0,SCENE_COUNT);
    setupPlayers(1); // DEFAULT_PLAYERS, like the MLand constructor
    reset();
    start(false);
    window.addEventListener("keydown",keyDown);
    window.addEventListener("keyup",keyUp);
    world.addEventListener("pointerdown",onPointerDown);
    world.addEventListener("pointerup",onPointerUp);
    world.addEventListener("pointercancel",onPointerUp);
    updateSetup();
    showSplash(); // MLandActivity.onResume shows the splash
  }
  function updateSetup(){
    var minus=document.getElementById("pminus"),plus=document.getElementById("pplus");
    minus.className="pbtn"+(players.length>MIN_PLAYERS?" vis":"");
    plus.className="pbtn"+(players.length<MAX_PLAYERS?" vis":"");
  }
  function startButtonPressed(){
    document.getElementById("pminus").classList.remove("vis");
    document.getElementById("pplus").classList.remove("vis");
    start(true);
  }

  function reset(){
    dp=Math.min(window.innerWidth,window.innerHeight)/360;
    var sky=SKIES[timeOfDay];
    var c=function(v){return "#"+("00000"+v.toString(16)).slice(-6);};
    world.style.background="linear-gradient(to top,"+c(sky[1])+","+c(sky[0])+")";
    flipped=frand()>0.5;
    world.style.transform=flipped?"scaleX(-1)":"";
    while(world.firstChild)world.removeChild(world.firstChild);
    obstacles=[];scenery=[];
    W=world.clientWidth/dp;H=world.clientHeight/dp;
    pipeId=0;

    // sun / moon
    var w=P.SUN_SIZE;
    var showingSun=(timeOfDay===DAY||timeOfDay===SUNSET)&&frand()>0.25;
    if(showingSun){
      var sun=el();
      sun.style.width=px(w);sun.style.height=px(w);
      sun.style.backgroundImage="url('"+(timeOfDay===DAY?SVGS.m_sun:SVGS.m_sun_orange)+"')";
      sun.style.left=px(frand2(w,W-w));
      sun.style.top=px(timeOfDay===DAY?frand2(w,H*0.66):frand2(H*0.66,H-w));
      if(timeOfDay!==DAY)sun.style.opacity=0.75;
      scenery.push({e:sun,v:0,w:w});
    }else{
      var dark=timeOfDay===NIGHT||timeOfDay===TWILIGHT;
      var ff=frand();
      if((dark&&ff<0.75)||ff<0.5){
        var moon=el();
        moon.style.width=px(w);moon.style.height=px(w);
        moon.style.backgroundImage="url('"+SVGS.m_moon+"')";
        moon.style.opacity=dark?"1":"0.5";
        var sx=frand()>0.5?-1:1;
        moon.style.transform="scaleX("+sx+") rotate("+(sx*frand2(5,30))+"deg)";
        moon.style.left=px(frand2(w,W-w));
        moon.style.top=px(frand2(w,H-w));
        scenery.push({e:moon,v:0,w:w});
      }
    }

    // scenery: stars / clouds / (buildings | cacti | mountains)
    var mh=H/6,cloudless=frand()<0.25,N=20;
    for(var i=0;i<N;i++){
      var r1=frand();
      var isStar=r1<0.3&&timeOfDay!==DAY;
      var isCloud=!isStar&&r1<0.6&&!cloudless;
      var isGround=!isStar&&!isCloud;
      var e=el(),sw,sh,vv=0,z=0,ground=false;
      if(isGround){
        z=i/N;
        vv=0.85*z;
        ground=true;
        if(scene===SCENE_CITY){
          sw=irand(P.BUILDING_WIDTH_MIN,P.BUILDING_WIDTH_MAX);
          sh=irand(P.BUILDING_HEIGHT_MIN,mh);
          e.style.background="rgb("+Math.round(136*z)+","+Math.round(136*z)+","+Math.round(136*z)+")";
        }else if(scene===SCENE_TX){
          sw=sh=irand(P.BUILDING_WIDTH_MAX/4,P.BUILDING_WIDTH_MAX/2);
          e.style.backgroundImage="url('"+SVGS[pick(CACTI)]+"')";
          e.style.backgroundSize="100% 100%";
          e.style.filter="brightness("+(z)+")";
        }else{
          sw=sh=irand(P.BUILDING_WIDTH_MAX/2,P.BUILDING_WIDTH_MAX);
          e.style.backgroundImage="url('"+SVGS[pick(MOUNTAINS)]+"')";
          e.style.backgroundSize="100% 100%";
          e.style.filter="brightness("+(z)+")";
          z=0;vv=0;
        }
      }else{
        sw=sh=isCloud?irand(P.CLOUD_SIZE_MIN,P.CLOUD_SIZE_MAX):irand(P.STAR_SIZE_MIN,P.STAR_SIZE_MAX);
        e.style.backgroundImage="url('"+(isCloud?(frand()<0.01?SVGS.m_cloud_off:SVGS.m_cloud):SVGS.m_star)+"')";
        e.style.backgroundSize="100% 100%";
        if(isCloud)e.style.opacity="0.25";
        var r=frand();
        var topMargin=isStar?(r*r*H):(H/2-r*r*H/2);
        e.style.top=px(Math.max(0,topMargin));
      }
      e.style.width=px(sw);e.style.height=px(sh);
      if(ground)e.style.top=px(H-sh); // bottom aligned
      e.style.left=px(frand2(-sw,W+sw));
      scenery.push({e:e,v:vv,w:sw});
    }

    // players
    for(var pi=0;pi<players.length;pi++){
      world.appendChild(players[pi].el);
      players[pi].reset();
    }
    realignPlayers();
  }

  /* ---------- splash / countdown ---------- */
  function showSplash(){
    if(!splash.classList.contains("vis")){
      splash.classList.add("vis");
      requestAnimationFrame(function(){splash.classList.add("on");});
      document.getElementById("playimg").style.opacity=1;
      document.getElementById("playtext").style.opacity=0;
    }
  }
  function hideSplash(){
    if(splash.classList.contains("vis")){
      splash.classList.remove("on");
      setTimeout(function(){splash.classList.remove("vis");},300);
    }
  }

  function start(startPlaying){
    if(startPlaying&&countdown<=0){
      showSplash();
      document.getElementById("playimg").style.opacity=0;
      countdown=3;
      var pt=document.getElementById("playtext");
      pt.style.opacity=1;
      pt.textContent=String(countdown);
      countdown--;
      clearInterval(countTimer);
      countTimer=setInterval(function(){
        if(countdown===0){
          clearInterval(countTimer);
          startPlayingNow();
        }
        pt.textContent=String(countdown);
        countdown--;
      },500);
    }
    for(var i=0;i<players.length;i++)players[i].el.style.display="none";
    if(!animating){animating=true;prevMs=0;if(!raf)raf=requestAnimationFrame(loop);}
  }

  function startPlayingNow(){
    playing=true;
    t=0;lastPipeTime=-P.OBSTACLE_PERIOD;
    hideSplash();
    realignPlayers();
    for(var i=0;i<players.length;i++){
      var p=players[i];
      p.el.style.display="block";
      p.reset();p.alive=true;
      p.boosting=true;p.dv=-P.BOOST_DV;
      p.boosting=false;
      p.place();
    }
  }

  function stop(){
    if(animating){
      animating=false;playing=false;
      timeOfDay=irand(0,SKIES.length-1); // for next reset
      scene=irand(0,SCENE_COUNT);
      frozen=true;
      for(var i=0;i<players.length;i++)players[i].die();
      setTimeout(function(){frozen=false;},250);
    }
  }

  function loop(ms){
    raf=requestAnimationFrame(loop);
    if(!prevMs){prevMs=ms;return;}
    var dt=Math.min((ms-prevMs)/1000,0.05);
    prevMs=ms;
    if(!animating)return;
    t+=dt;
    step(dt);
  }

  /* ---------- obstacles ---------- */
  function Obstacle(el,stem,w,h,finalTop,flipY,spin,animFromTop,animDelay,animDur,animScale,spawnX){
    this.el=el;this.stem=stem;this.w=w;this.h=h;
    this.finalTop=finalTop;this.x=spawnX;this.id=pipeId;
    this.spin=spin;this.rot=0;
    this.visTop=animFromTop;
    this.visScaleY=animScale?(flipY?-0.25:0.25):1;
    this.anim={fromTop:animFromTop,toTop:finalTop,fromScale:animScale?(flipY?-0.25:0.25):1,
               toScale:flipY?-1:1,start:t+animDelay/1000,dur:animDur/1000,done:false};
  }
  Obstacle.prototype.step=function(dt){
    this.x-=P.TRANSLATION_PER_SEC*dt;
    var a=this.anim;
    if(!a.done){
      var k=(t-a.start)/a.dur;
      if(k>=1){k=1;a.done=true;}
      if(k>=0){
        this.visTop=a.fromTop+(a.toTop-a.fromTop)*k;
        this.visScaleY=a.fromScale+(a.toScale-a.fromScale)*k;
      }
    }
    if(this.spin!==0)this.rot+=dt*45*this.spin;
    this.el.style.left=px(this.x);
    this.el.style.top=px(this.visTop);
    this.el.style.transform="scaleY("+this.visScaleY+")"
      +(this.spin!==0?" rotate("+this.rot+"deg)":"");
  };
  Obstacle.prototype.hitRect=function(){
    return {left:this.x,right:this.x+this.w,top:this.finalTop,bottom:this.finalTop+this.h};
  };
  Obstacle.prototype.intersects=function(c){
    var r=this.hitRect();
    if(this.stem){
      for(var i=0;i<c.length/2;i++){
        var x=c[i*2],y=c[i*2+1];
        if(x>=r.left&&x<r.right&&y>=r.top&&y<r.bottom)return true;
      }
      return false;
    }
    var cx=r.left+r.w/2,cy=r.top+r.h/2,rad=r.w/3; // marshmallow hitbox is 2/3
    for(var i2=0;i2<c.length/2;i2++){
      var dx=c[i2*2]-cx,dy=c[i2*2+1]-cy;
      if(Math.sqrt(dx*dx+dy*dy)<=rad)return true;
    }
    return false;
  };
  Obstacle.prototype.cleared=function(c){
    var r=this.hitRect();
    for(var i=0;i<c.length/2;i++){if(r.right>=c[i*2])return false;}
    return true;
  };

  function makeStemEl(h,drawShadow){
    var e=el();
    e.style.width=px(P.OBSTACLE_STEM_WIDTH);e.style.height=px(h);
    e.style.zIndex=P.OBSTACLE_Z*0.75;
    if(frand()<0.01){ // rare candystripe stem!
      e.style.background="repeating-linear-gradient(0deg,#fff 0px,#fff "+(4*P.OBSTACLE_STEM_WIDTH*dp)+"px,#FF0000 "+(4*P.OBSTACLE_STEM_WIDTH*dp)+"px,"+(4*P.OBSTACLE_STEM_WIDTH*dp)+"px,#FF0000 "+(6*P.OBSTACLE_STEM_WIDTH*dp)+"px)";
      e.style.background="linear-gradient(90deg,#fff,#ddd)";
    }else{
      e.style.background="linear-gradient(90deg,#BCAAA4 0%,#BCAAA4 55%,#A1887F 100%)";
    }
    if(drawShadow){
      var sh=el();
      sh.style.width=px(P.OBSTACLE_STEM_WIDTH);
      sh.style.height=px(P.OBSTACLE_WIDTH*0.4+P.OBSTACLE_STEM_WIDTH*1.5);
      sh.style.left="0";sh.style.top="0";
      sh.style.background="rgba(0,0,0,.13)";
      var tot=P.OBSTACLE_WIDTH*0.4+P.OBSTACLE_STEM_WIDTH*1.5;
      sh.style.clipPath="polygon(0 0,100% 0,100% 100%,0 "+(P.OBSTACLE_WIDTH*0.4/tot*100)+"%)";
      e.appendChild(sh);
    }
    return e;
  }
  function makePopEl(){
    var e=el();
    var size=P.OBSTACLE_WIDTH;
    e.style.width=px(size);e.style.height=px(size);
    e.style.zIndex=P.OBSTACLE_Z;
    var imgs=["url('"+SVGS.m_mm_head+"')"];
    imgs.push("url('"+SVGS[pick(ANTENNAE)]+"')");
    if(frand()>0.5){
      imgs.push("url('"+SVGS[pick(EYES)]+"')");
      if(frand()>0.8)imgs.push("url('"+SVGS[pick(MOUTHS)]+"')");
    }
    e.style.backgroundImage=imgs.join(",");
    e.style.backgroundSize="100% 100%";
    e.style.backgroundRepeat="no-repeat";
    return e;
  }

  /* ---------- main step ---------- */
  function step(dt){
    var i;
    for(i=0;i<scenery.length;i++){
      var s=scenery[i];
      if(s.v>0){
        var x=parseFloat(s.e.style.left)-P.TRANSLATION_PER_SEC*dt*s.v;
        if(x+s.w<0)x=W;
        s.e.style.left=px(x);
      }
    }
    for(i=0;i<obstacles.length;i++)obstacles[i].step(dt);
    for(i=0;i<players.length;i++)players[i].step(dt);

    if(playing){
      var living=0;
      for(i=0;i<players.length;i++){
        var p=players[i];
        if(p.alive){
          var corners=p.corners();
          // altitude
          for(var ci=0;ci<corners.length/2;ci++){
            if(corners[ci*2+1]>=H){p.die();break;}
          }
          // obstacles
          var maxPassedStem=0;
          for(var j=obstacles.length;j-->0;){
            var ob=obstacles[j];
            if(p.alive&&ob.intersects(corners))p.die();
            else if(ob.cleared(corners)&&ob.stem)maxPassedStem=Math.max(maxPassedStem,ob.id);
          }
          if(maxPassedStem>p.score)p.setScore(p.score+1);
        }
        if(p.alive)living++;
      }
      if(living===0)stop();
    }

    // edge of screen
    for(i=obstacles.length;i-->0;){
      var o=obstacles[i];
      if(o.x+o.w<0){
        if(o.el.parentNode)o.el.parentNode.removeChild(o.el);
        obstacles.splice(i,1);
      }
    }

    // spawn obstacles
    if(playing&&(t-lastPipeTime)>P.OBSTACLE_PERIOD){
      lastPipeTime=t;pipeId++;
      var obstacley=frand()*(H-2*P.OBSTACLE_MIN-P.OBSTACLE_GAP)+P.OBSTACLE_MIN;
      var inset=(P.OBSTACLE_WIDTH-P.OBSTACLE_STEM_WIDTH)/2;
      var yinset=P.OBSTACLE_WIDTH/2;
      var d1=irand(0,250);

      var s1=new Obstacle(makeStemEl(obstacley-yinset,false),true,
        P.OBSTACLE_STEM_WIDTH,obstacley-yinset,0,false,0,-obstacley-2*yinset,d1,250,false,W+inset);
      obstacles.push(s1);

      var p1=new Obstacle(makePopEl(),false,
        P.OBSTACLE_WIDTH,P.OBSTACLE_WIDTH,obstacley-yinset-inset,true,0,-P.OBSTACLE_WIDTH,d1,250,true,W);
      obstacles.push(p1);

      var d2=irand(0,250);
      var h2=H-obstacley-P.OBSTACLE_GAP-yinset;
      var s2=new Obstacle(makeStemEl(h2,true),true,
        P.OBSTACLE_STEM_WIDTH,h2,H-h2,false,0,H+yinset,d2,400,false,W+inset);
      obstacles.push(s2);

      var p2=new Obstacle(makePopEl(),false,
        P.OBSTACLE_WIDTH,P.OBSTACLE_WIDTH,H-h2-yinset,false,0,H,d2,400,true,W);
      obstacles.push(p2);
    }

    drawTouches();
  }

  /* ---------- input ---------- */
  var touchIds={};
  function playerIndexForX(x){
    var idx=Math.floor(players.length*(x/dp)/(W*dp));
    idx=Math.max(0,Math.min(players.length-1,idx));
    if(flipped)idx=players.length-1-idx;
    return idx;
  }
  function onPointerDown(e){
    e.preventDefault();
    var rect=world.getBoundingClientRect();
    var x=e.clientX-rect.left,y=e.clientY-rect.top;
    var idx=playerIndexForX(x);
    touchIds[e.pointerId]=idx;
    poke(idx,x/dp,y/dp);
  }
  function onPointerUp(e){
    var idx=touchIds[e.pointerId];
    if(idx===undefined)idx=0;
    delete touchIds[e.pointerId];
    unpoke(idx);
  }
  function poke(idx,x,y){
    if(frozen)return;
    if(!animating){reset();}
    if(!playing){start(true);}
    else{
      var p=players[idx];
      if(!p)return;
      p.boosting=true;p.dv=-P.BOOST_DV;
      p.touchX=x;p.touchY=y;
    }
  }
  function unpoke(idx){
    if(frozen||!animating||!playing)return;
    var p=players[idx];
    if(!p)return;
    p.boosting=false;
    p.touchX=p.touchY=-1;
  }
  function keyDown(e){
    if(e.code==="Space"||e.code==="Enter"||e.code==="ArrowUp"||e.code==="KeyW"){e.preventDefault();poke(0,-1,-1);}
  }
  function keyUp(e){
    if(e.code==="Space"||e.code==="Enter"||e.code==="ArrowUp"||e.code==="KeyW")unpoke(0);
  }

  /* ---------- touch indicators (SHOW_TOUCHES) ---------- */
  var tc=document.getElementById("touchcanvas"),tcx=tc.getContext("2d");
  function drawTouches(){
    tc.width=tc.offsetWidth;tc.height=tc.offsetHeight;
    tcx.clearRect(0,0,tc.width,tc.height);
    for(var i=0;i<players.length;i++){
      var p=players[i];
      if(p.touchX>0){
        var x1=p.touchX*dp,y1=p.touchY*dp;
        tcx.beginPath();tcx.arc(x1,y1,100,0,7);
        tcx.fillStyle="rgba(255,255,255,.5)";
        tcx.fill();
        var x2=p.x*dp,y2=p.y*dp;
        var ang=Math.PI/2-Math.atan2(x2-x1,y2-y1);
        tcx.beginPath();
        tcx.moveTo(x1+100*Math.cos(ang),y1+100*Math.sin(ang));
        tcx.lineTo(x2,y2);
        tcx.strokeStyle="rgba(255,255,255,.5)";
        tcx.lineWidth=2*dp;
        tcx.stroke();
      }
    }
  }

  return {init:init};
})();
</script>
</body>
