<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Android 5</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;
    -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;}
  *{box-sizing:border-box}
  .screen{position:fixed;inset:0;display:none}
  .screen.on{display:block}

  /* ---------- PlatLogo ---------- */
  #logo-screen{background:#000}
  #stick{position:absolute;left:50%;top:0;height:100%;width:calc(32*var(--dp));
    transform:translateX(-50%);opacity:0;transition:opacity .7s ease .75s;
    z-index:1;pointer-events:none}
  #stick .rod{position:absolute;top:50%;bottom:0;left:0;width:100%;
    background:linear-gradient(90deg,#fff 0%,#fff 55%,#aaa 100%)}
  #stick .shadow{position:absolute;top:50%;left:0;width:100%;
    height:calc(var(--size)/2 + 1.5*var(--size));background:#aaa;
    clip-path:polygon(0 0,100% 0,100% 100%,0 48.4%)}
  #lolli{position:absolute;left:50%;top:50%;width:var(--size);height:var(--size);
    margin-left:calc(var(--size)/-2);margin-top:calc(var(--size)/-2);
    border-radius:50%;cursor:pointer;z-index:2;
    transform:scale(0.001);transition:transform .5s cubic-bezier(0,0,.5,1) .8s;
    background-size:100% 100%;background-repeat:no-repeat}
  #lolli.grow{transform:scale(0.3)}
  #lolli.full{transform:scale(1);transition:transform .7s cubic-bezier(0,0,.5,1) .5s}
  #platlogo{position:absolute;inset:0;border-radius:50%;opacity:0;transition:opacity .5s ease 1s;
    background-size:100% 100%;background-repeat:no-repeat}
  #lolli.show #platlogo{opacity:1}
  #lolli .hl{position:absolute;left:15%;top:15%;width:45%;height:45%;border-radius:50%;
    background:rgba(255,255,255,.063);pointer-events:none}

  /* ---------- LLand ---------- */
  #game-screen{background:#000;touch-action:none}
  #world{position:absolute;inset:0;overflow:hidden}
  #world>div{position:absolute}
  #score{position:absolute;top:calc(32*var(--dp));left:calc(16*var(--dp));z-index:100;
    font-family:Roboto,Arial,sans-serif;font-size:calc(32*var(--dp));line-height:1.1;
    color:#aaa;padding:calc(8*var(--dp)) calc(16*var(--dp));
    background:rgba(255,255,255,.95);border-radius:calc(8*var(--dp));
    transform:translateY(-500px);transition:transform 1.5s ease-out;min-width:1.6em;text-align:center}
</style>
</head>
<body>

<!-- ============ SCREEN 1: PlatLogoActivity ============ -->
<div class="screen on" id="logo-screen">
  <div id="stick"><div class="shadow"></div><div class="rod"></div></div>
  <div id="lolli">
    <div class="hl"></div>
    <div id="platlogo"></div>
  </div>
</div>

<!-- ============ SCREEN 2: LLandActivity ============ -->
<div class="screen" id="game-screen">
  <div id="world"></div>
  <div id="score">0</div>
</div>

/* ================= PlatLogoActivity ================= */
(function(){
  var FLAVORS = [0x9C27B0,0xBA68C8, 0xFF9800,0xFFB74D, 0xF06292,0xF8BBD0,
                 0xAFB42B,0xCDDC39, 0xFFEB3B,0xFFF176, 0x795548,0xA1887F];
  function hex(n){return "#"+("00000"+n.toString(16)).slice(-6);}
  function newColorIndex(){return 2*Math.floor(Math.random()*FLAVORS.length/2);}

  var screen=document.getElementById("logo-screen");
  var lolli=document.getElementById("lolli");
  var platlogo=document.getElementById("platlogo");
  var stick=document.getElementById("stick");
  var tapCount=0, unlocked=false, pressTimer=null, longFired=false;

  function layout(){
    var dp=Math.min(window.innerWidth,window.innerHeight)/360;
    document.documentElement.style.setProperty("--dp",dp+"px");
    var size=Math.min(Math.min(window.innerWidth,window.innerHeight),600*dp)-100*dp;
    screen.style.setProperty("--size",size+"px");
  }
  layout();
  window.addEventListener("resize",layout);

  platlogo.style.backgroundImage="url('"+SVGS.l_platlogo+"')";
  makeRipple();
  requestAnimationFrame(function(){lolli.classList.add("grow");}); // initial scale -> 0.3

  function makeRipple(){
    var idx=newColorIndex();
    lolli.style.backgroundColor=hex(FLAVORS[idx]);
    lolli.dataset.ripple=hex(FLAVORS[idx+1]);
  }

  lolli.addEventListener("pointerdown",function(){
    lolli.style.filter="brightness(1.15)";
    longFired=false;
    if(unlocked){pressTimer=setTimeout(function(){if(onLongClick())longFired=true;},600);}
  });
  lolli.addEventListener("pointerup",function(){
    lolli.style.filter="";
    clearTimeout(pressTimer);
  });
  lolli.addEventListener("pointerleave",function(){clearTimeout(pressTimer);});

  function onClick(){
    if(tapCount===0){
      lolli.classList.remove("grow");
      lolli.classList.add("full");           // scale -> 1 (700ms, delay .5s)
      lolli.classList.add("show");           // platlogo alpha -> 1 (delay 1s)
      stick.style.opacity="1";               // stick fade in (delay .75s)
      unlocked=true;                          // enable long-press
    }else{
      makeRipple();
    }
    tapCount++;
  }
  function onLongClick(){
    if(tapCount<5) return false;
    document.getElementById("logo-screen").classList.remove("on");
    document.getElementById("game-screen").classList.add("on");
    LLand.init();
    return true;
  }

  lolli.addEventListener("click",function(){if(!longFired)onClick();});

  // keyboard (TV compatibility): any key = tap; hold a key after 5 taps = long click
  var keyCount=0;
  window.addEventListener("keydown",function(e){
    if(unlocked&&tapCount>5){onLongClick();return;} // held key repeats -> long click
    if(e.repeat) return;
    e.preventDefault();
    keyCount++;
    if(keyCount>2){onClick();}
  });
})();

/* ================= LLand ================= */
var LLand=(function(){
  // dimens (dp) from lland_config.xml
  var P={TRANSLATION_PER_SEC:100,OBSTACLE_SPACING:380,BOOST_DV:550,PLAYER_HIT_SIZE:40,PLAYER_SIZE:40,
    OBSTACLE_WIDTH:90,OBSTACLE_STEM_WIDTH:12,OBSTACLE_GAP:170,OBSTACLE_MIN:40,
    BUILDING_WIDTH_MIN:20,BUILDING_WIDTH_MAX:250,BUILDING_HEIGHT_MIN:20,
    CLOUD_SIZE_MIN:10,CLOUD_SIZE_MAX:100,SUN_SIZE:45,STAR_SIZE_MIN:3,STAR_SIZE_MAX:5,
    G:30,MAX_V:1000,SCENERY_Z:6,OBSTACLE_Z:18,PLAYER_Z:18,PLAYER_Z_BOOST:20,HUD_Z:35};
  P.OBSTACLE_PERIOD=P.OBSTACLE_SPACING/P.TRANSLATION_PER_SEC; // 3.8 s

  var SKIES=[[0xc0c0ff,0xa0a0ff],[0x000010,0x000000],[0x000040,0x000010],[0xa08020,0x204080]];
  var DAY=0,NIGHT=1,TWILIGHT=2,SUNSET=3;
  var POPS=[["l_pop_belt",0],["l_pop_droid",0],["l_pop_pizza",1],["l_pop_stripes",0],
            ["l_pop_swirl",1],["l_pop_vortex",1],["l_pop_vortex2",1]];

  var world,scoreEl,dp,playing=false,animating=false,frozen=false,flipped=false;
  var score=0,lastPipeTime=0,W=0,H=0,timeOfDay=0,t=0;
  var droid=null,obstacles=[],scenery=[],raf=null,prevMs=0;
  var boosting=false,dv=0;

  function frand(){return Math.random();}
  function frand2(a,b){return (b-a)*frand()+a;}
  function irand(a,b){return Math.floor(frand2(a,b));}
  function lerp(x,a,b){return (b-a)*x+a;}
  function rlerp(v,a,b){return (v-a)/(b-a);}
  function clamp(f){return f<0?0:f>1?1:f;}
  function px(v){return v*dp+"px";}
  function el(parent){var d=document.createElement("div");(parent||world).appendChild(d);return d;}

  function init(){
    world=document.getElementById("world");
    scoreEl=document.getElementById("score");
    dp=Math.min(window.innerWidth,window.innerHeight)/360;
    reset();
    start(false);
    window.addEventListener("keydown",keyDown);
    window.addEventListener("keyup",keyUp);
    world.addEventListener("pointerdown",function(e){e.preventDefault();poke();});
    world.addEventListener("pointerup",unpoke);
    world.addEventListener("pointercancel",unpoke);
    world.addEventListener("pointerleave",unpoke);
    window.addEventListener("resize",function(){stop();reset();start(false);});
  }

  function reset(){
    dp=Math.min(window.innerWidth,window.innerHeight)/360;
    var sky=SKIES[timeOfDay];
    var c=function(v){return "#"+("00000"+v.toString(16)).slice(-6);};
    world.style.background="linear-gradient(to top,"+c(sky[1])+","+c(sky[0])+")";
    flipped=frand()>0.5;
    world.style.transform=flipped?"scaleX(-1)":"";
    setScore(0);
    while(world.firstChild)world.removeChild(world.firstChild);
    obstacles=[];scenery=[];
    W=world.clientWidth/dp;H=world.clientHeight/dp; // game units are dp
    dv=0;boosting=false;

    // ---- sun or moon ----
    var w=SUN_SIZE_;
    var showingSun=(timeOfDay===DAY||timeOfDay===SUNSET)&&frand()>0.25;
    if(showingSun){
      var sun=el();
      sun.style.width=px(w);sun.style.height=px(w);
      sun.style.backgroundImage="url('"+(timeOfDay===DAY?SVGS.l_sun:SVGS.l_sun_orange)+"')";
      sun.style.left=px(frand2(w,W-w));
      sun.style.top=px(timeOfDay===DAY?frand2(w,H*0.66):frand2(H*0.66,H-w));
      if(timeOfDay!==DAY)sun.style.opacity=0.75;
      scenery.push({e:sun,v:0,w:w});
    }else{
      var dark=timeOfDay===NIGHT||timeOfDay===TWILIGHT;
      var ff=frand();
      if((dark&&ff<0.75)||ff<0.5){
        var moon=el();
        moon.style.width=px(w);moon.style.height=px(w);
        moon.style.backgroundImage="url('"+SVGS.l_moon+"')";
        moon.style.opacity=dark?"1":"0.5";
        var sx=frand()>0.5?-1:1;
        moon.style.transform="scaleX("+sx+") rotate("+(sx*frand2(5,30))+"deg)";
        moon.style.left=px(frand2(w,W-w));
        moon.style.top=px(frand2(w,H-w));
        scenery.push({e:moon,v:0,w:w});
      }
    }

    // ---- scenery: stars / clouds / buildings ----
    var mh=H/6,cloudless=frand()<0.25,N=20;
    for(var i=0;i<N;i++){
      var r1=frand();
      var isStar=r1<0.3&&timeOfDay!==DAY;
      var isCloud=!isStar&&r1<0.6&&!cloudless;
      var isBuilding=!isStar&&!isCloud;
      var e=el(),sw,sh,vv=0;
      if(isBuilding){
        sw=irand(P.BUILDING_WIDTH_MIN,P.BUILDING_WIDTH_MAX);
        sh=irand(P.BUILDING_HEIGHT_MIN,mh);
        var z=i/N;
        vv=0.85*z;
        e.style.background="hsl(175,25%,"+(z*100)+"%)";
        e.style.top=px(H-sh); // bottom-aligned
      }else{
        sw=sh=isCloud?irand(P.CLOUD_SIZE_MIN,P.CLOUD_SIZE_MAX):irand(P.STAR_SIZE_MIN,P.STAR_SIZE_MAX);
        e.style.backgroundImage="url('"+(isCloud?(frand()<0.01?SVGS.l_cloud_off:SVGS.l_cloud):SVGS.l_star)+"')";
        if(isCloud)e.style.opacity="0.25";
        var r=frand();
        var topMargin=isStar?(r*r*H):(H/2-r*r*H/2);
        e.style.top=px(Math.max(0,topMargin));
      }
      e.style.width=px(sw);e.style.height=px(sh);
      e.style.left=px(frand2(-sw,W+sw));
      scenery.push({e:e,v:vv,w:sw});
    }

    // ---- player ----
    droid=el();
    droid.style.width=px(P.PLAYER_SIZE);droid.style.height=px(P.PLAYER_SIZE);
    droid.style.backgroundImage="url('"+SVGS.l_android_green+"')";
    droid.style.zIndex=P.PLAYER_Z;
    droid.style.display="none";
    droid._x=W/2;droid._y=H/2;droid._rot=0;
    placeDroid();
  }
  var SUN_SIZE_=45;

  function placeDroid(){
    droid.style.left=px(droid._x-P.PLAYER_SIZE/2);
    droid.style.top=px(droid._y-P.PLAYER_SIZE/2);
  }

  function setScore(v){score=v;scoreEl.textContent=String(v);}

  function start(startPlaying){
    if(startPlaying){
      playing=true;t=0;lastPipeTime=-P.OBSTACLE_PERIOD;
      scoreEl.style.transform="translateY(0)";
      scoreEl.style.color="#aaa";
      scoreEl.style.background="rgba(255,255,255,.95)";
      droid.style.display="block";
      droid._x=W/2;droid._y=H/2;dv=0;boosting=false;placeDroid();
    }else{
      droid.style.display="none";
    }
    animating=true;prevMs=0;
    if(!raf)raf=requestAnimationFrame(loop);
  }

  function stop(){
    if(animating){
      animating=false;playing=false;
      scoreEl.style.color="#fff";
      scoreEl.style.background="rgba(0,0,0,.55)";
      timeOfDay=irand(0,SKIES.length); // for next reset
      frozen=true;
      setTimeout(function(){frozen=false;},250);
    }
  }

  function loop(ms){
    raf=requestAnimationFrame(loop);
    if(!prevMs){prevMs=ms;return;}
    var dt=Math.min((ms-prevMs)/1000,0.05);
    prevMs=ms;
    if(!animating)return;
    t+=dt;
    step(dt);
  }

  // ---- obstacles ----
  function Obstacle(el,stem,w,h,finalTop,flip,rotate,animFromTop,animDelay,animDur,animScale,spawnX){
    this.el=el;this.stem=stem;this.w=w;this.h=h;
    this.finalTop=finalTop;
    this.x=spawnX;
    this.flip=flip;
    this.rotate=rotate; // 0 or +-1 (45 deg/sec)
    this.rot=0;
    // entrance animation state (visual only; collisions use final layout, like Android)
    this.visTop=animFromTop;
    this.visScale=animScale?0.25:1;
    this.anim={fromTop:animFromTop,toTop:finalTop,fromScale:animScale?0.25:1,toScale:1,
               start:t+animDelay/1000,dur:animDur/1000,done:false};
  }
  Obstacle.prototype.step=function(dt){
    this.x-=P.TRANSLATION_PER_SEC*dt;
    var a=this.anim;
    if(!a.done){
      var k=(t-a.start)/a.dur;
      if(k>=1){k=1;a.done=true;}
      if(k>=0){
        this.visTop=a.fromTop+(a.toTop-a.fromTop)*k;
        this.visScale=a.fromScale+(a.toScale-a.fromScale)*k;
      }
    }
    if(this.rotate!==0)this.rot+=dt*45*this.rotate;
    this.el.style.left=px(this.x);
    this.el.style.top=px(this.visTop);
    this.el.style.transform=(this.flip?"scaleX(-1) ":"")+"scale("+this.visScale+")"
      +(this.rotate!==0?" rotate("+this.rot+"deg)":"");
  };
  Obstacle.prototype.hitRect=function(){
    return {left:this.x,right:this.x+this.w,top:this.finalTop,bottom:this.finalTop+this.h};
  };
  Obstacle.prototype.intersects=function(c){
    var r=this.hitRect();
    if(this.stem){ // rect test
      for(var i=0;i<c.length/2;i++){
        var x=c[i*2],y=c[i*2+1];
        if(x>=r.left&&x<r.right&&y>=r.top&&y<r.bottom)return true;
      }
      return false;
    }
    var cx=r.left+r.w/2,cy=r.top+r.h/2,rad=r.w/2; // circle test (Pop)
    for(var i2=0;i2<c.length/2;i2++){
      var dx=c[i2*2]-cx,dy=c[i2*2+1]-cy;
      if(Math.sqrt(dx*dx+dy*dy)<=rad)return true;
    }
    return false;
  };
  Obstacle.prototype.cleared=function(c){
    var r=this.hitRect();
    for(var i=0;i<c.length/2;i++){if(r.right>=c[i*2])return false;}
    return true;
  };

  function makeStemEl(h,drawShadow){
    var e=el();
    e.style.width=px(P.OBSTACLE_STEM_WIDTH);e.style.height=px(h);
    e.style.background="linear-gradient(90deg,#fff 0%,#fff 55%,#aaa 100%)";
    e.style.zIndex=Math.floor(P.OBSTACLE_Z*0.75); // fractional z-index would be ignored by CSS
    if(drawShadow){ // shadow on the lower stem, drawn downward from its top edge
      var sh=el();
      sh.style.width=px(P.OBSTACLE_STEM_WIDTH);
      sh.style.height=px(P.OBSTACLE_WIDTH/2+P.OBSTACLE_STEM_WIDTH*1.5);
      sh.style.left="0";sh.style.top="0";
      sh.style.background="#aaa";
      sh.style.clipPath="polygon(0 0,100% 0,100% 100%,0 "+(P.OBSTACLE_WIDTH/2/(P.OBSTACLE_WIDTH/2+P.OBSTACLE_STEM_WIDTH*1.5)*100)+"%)";
      e.appendChild(sh);
    }
    return e;
  }
  function makePopEl(name,flip){
    var e=el();
    e.style.width=px(P.OBSTACLE_WIDTH);e.style.height=px(P.OBSTACLE_WIDTH);
    e.style.backgroundImage="url('"+SVGS[name]+"')";
    e.style.zIndex=P.OBSTACLE_Z;
    return e;
  }

  // ---- main step ----
  function step(dt){
    var i;
    // 1. move scenery + obstacles
    for(i=0;i<scenery.length;i++){
      var s=scenery[i];
      if(s.v>0){
        var x=parseFloat(s.e.style.left)-P.TRANSLATION_PER_SEC*dt*s.v;
        if(x+s.w<0)x=W;
        s.e.style.left=px(x);
      }
    }
    for(i=0;i<obstacles.length;i++)obstacles[i].step(dt);

    // player physics
    if(playing){
      if(boosting)dv=-P.BOOST_DV;
      else dv+=P.G*dt*60;
      if(dv<-P.MAX_V)dv=-P.MAX_V;else if(dv>P.MAX_V)dv=P.MAX_V;
      var y=Math.max(0,droid._y+dv*dt);
      droid._y=y;
      droid._rot=90+lerp(clamp(rlerp(dv,P.MAX_V,-P.MAX_V)),90,-90);
      placeDroid();
      droid.style.transform=(boosting?"scale(1.25)":"scale(1)")+" rotate("+droid._rot+"deg)";
    }
    var corners=droidCorners();

    // 2. altitude
    if(playing){
      for(i=0;i<corners.length/2;i++){
        if(corners[i*2+1]>=H){stop();break;}
      }
    }

    // 3. obstacle collisions / clearing
    // (like the original: "cleared" only removes the obstacle from collision
    //  checks — it stays visible until it fully leaves the left edge)
    var passedBarrier=false;
    for(var j=obstacles.length;j-->0;){
      var ob=obstacles[j];
      if(ob.clearedFlag){
        // already passed: no collisions, no more score
      }else if(playing&&ob.intersects(corners)){stop();}
      else if(ob.cleared(corners)){
        if(ob.stem)passedBarrier=true;
        ob.clearedFlag=true;
      }
    }
    if(playing&&passedBarrier)setScore(score+1);

    // 4. remove off-screen obstacles
    for(i=obstacles.length;i-->0;){
      var o=obstacles[i];
      if(o.x+o.w<0){
        if(o.el.parentNode)o.el.parentNode.removeChild(o.el);
        obstacles.splice(i,1);
      }
    }

    // 5. spawn obstacles
    if(playing&&(t-lastPipeTime)>P.OBSTACLE_PERIOD){
      lastPipeTime=t;
      var obstacley=Math.random()*(H-2*P.OBSTACLE_MIN-P.OBSTACLE_GAP)+P.OBSTACLE_MIN;
      var inset=(P.OBSTACLE_WIDTH-P.OBSTACLE_STEM_WIDTH)/2;
      var yinset=P.OBSTACLE_WIDTH/2;
      var d1=irand(0,250);

      var s1=new Obstacle(makeStemEl(obstacley-yinset,false),true,
        P.OBSTACLE_STEM_WIDTH,obstacley-yinset,0,false,0,-obstacley-2*yinset,d1,250,false,W+inset);
      obstacles.push(s1);

      var p1=new Obstacle(makePopEl.apply(null,popPick()),false,
        P.OBSTACLE_WIDTH,P.OBSTACLE_WIDTH,obstacley-yinset-inset,null,0,-P.OBSTACLE_WIDTH,d1,250,true,W);
      p1.flip=frand()<0.5;
      obstacles.push(p1);

      var d2=irand(0,250);
      var h2=H-obstacley-P.OBSTACLE_GAP-yinset;
      var s2=new Obstacle(makeStemEl(h2,true),true,
        P.OBSTACLE_STEM_WIDTH,h2,H-h2,false,0,H+yinset,d2,400,false,W+inset);
      obstacles.push(s2);

      var p2=new Obstacle(makePopEl.apply(null,popPick()),false,
        P.OBSTACLE_WIDTH,P.OBSTACLE_WIDTH,H-h2-yinset,null,0,H,d2,400,true,W);
      p2.flip=frand()<0.5;
      obstacles.push(p2);
    }
  }

  function popPick(){
    var idx=2*irand(0,POPS.length/2);
    return [POPS[idx][0],POPS[idx][1]===1]; // name, spinny
  }

  // player hull corners (matches Player.prepareCheckIntersections)
  var sHull=[0.3,0, 0.7,0, 0.92,0.33, 0.92,0.75, 0.6,1, 0.4,1, 0.08,0.75, 0.08,0.33];
  function droidCorners(){
    var cur=boosting?1.25:1;
    var inset=(P.PLAYER_SIZE-P.PLAYER_HIT_SIZE)/2;
    var rot=droid._rot*Math.PI/180;
    var cx=droid._x,cy=droid._y,out=[];
    for(var i=0;i<sHull.length/2;i++){
      var hx=sHull[i*2]*P.PLAYER_HIT_SIZE+inset-P.PLAYER_SIZE/2;
      var hy=sHull[i*2+1]*P.PLAYER_HIT_SIZE+inset-P.PLAYER_SIZE/2;
      out.push(cx+(hx*Math.cos(rot)-hy*Math.sin(rot))*cur,
               cy+(hx*Math.sin(rot)+hy*Math.cos(rot))*cur);
    }
    return out;
  }

  function poke(){
    if(frozen)return;
    if(!animating){timeOfDay=irand(0,SKIES.length);reset();start(true);}
    else if(!playing)start(true);
    boosting=true;dv=-P.BOOST_DV;
  }
  function unpoke(){
    if(frozen||!animating)return;
    boosting=false;
  }
  function keyDown(e){
    if(e.code==="Space"||e.code==="Enter"||e.code==="ArrowUp"||e.code==="KeyW"){e.preventDefault();poke();}
  }
  function keyUp(e){
    if(e.code==="Space"||e.code==="Enter"||e.code==="ArrowUp"||e.code==="KeyW")unpoke();
  }

  return {init:init};
})();
</script>
