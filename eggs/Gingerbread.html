<script>
"use strict";
/* com.android_g.egg.PlatLogoActivity
   dispatchTouchEvent: ACTION_UP -> mToast.show() */
var platScreen = document.getElementById("platlogo-screen");
var toast = document.getElementById("toast");

/* LENGTH_SHORT ~ 2s */
platScreen.addEventListener("pointerup", function () {
  toast.classList.add("show");
  clearTimeout(platScreen._t);
  platScreen._t = setTimeout(function () { toast.classList.remove("show"); }, 2000);
});
platScreen.addEventListener("contextmenu", function (e) { e.preventDefault(); });
