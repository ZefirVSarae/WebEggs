<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Eggs</title>
    
    <!-- Пиксельный шрифт -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <style>
        :root {
            --md-sys-color-background: #1a1a1a;
            --md-sys-color-surface-container: #2b2b2b;
            --md-sys-color-surface-container-hover: #383838;
            --md-sys-color-on-surface: #e6e1e5;
            --md-sys-color-on-surface-variant: #cac4d0;
            --md-sys-color-primary: #d0bcff;
            --md-sys-color-outline: #49454f;
            --font-family: system-ui, -apple-system, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--md-sys-color-background);
            color: var(--md-sys-color-on-surface);
            font-family: var(--font-family);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Шапка сайта */
        header {
            padding: 32px 24px;
            border-bottom: 1px solid var(--md-sys-color-outline);
            display: flex;
            justify-content: center; /* Центрируем, так как кнопки больше нет */
        }

        h1 {
            font-family: 'Press Start 2P', monospace;
            font-size: 28px;
            font-weight: normal;
            line-height: 1.4;
            color: #ffffff;
            text-shadow: 3px 3px 0px rgba(0,0,0,0.5);
            text-align: center;
        }

        /* Контейнер карточек */
        main {
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
        }

        /* Material 3 Expressive Card */
        .egg-card {
            background-color: var(--md-sys-color-surface-container);
            border-radius: 28px;
            padding: 20px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.2s ease, transform 0.1s ease;
            animation: fadeIn 0.3s ease-out forwards;
            opacity: 0;
            transform: translateY(10px);
            gap: 16px;
        }

        @keyframes fadeIn {
            to { opacity: 1; transform: translateY(0); }
        }

        .egg-card:hover { background-color: var(--md-sys-color-surface-container-hover); }
        .egg-card:active { transform: scale(0.98); }

        .egg-info {
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow: hidden;
        }

        .egg-filename {
            font-size: 18px;
            font-weight: 600;
            color: var(--md-sys-color-on-surface);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .egg-title {
            font-size: 14px;
            color: var(--md-sys-color-on-surface-variant);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn-launch {
            background: transparent;
            color: var(--md-sys-color-primary);
            border: none;
            padding: 12px 24px;
            border-radius: 100px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            font-family: var(--font-family);
            text-decoration: none;
            white-space: nowrap;
        }

        .btn-launch:hover { background-color: rgba(208, 188, 255, 0.08); }

        .empty-state {
            text-align: center;
            margin-top: 40px;
            color: var(--md-sys-color-on-surface-variant);
            font-size: 16px;
            line-height: 1.5;
            padding: 0 20px;
        }

        /* --- АДАПТИВНОСТЬ ДЛЯ ТЕЛЕФОНОВ --- */
        @media (max-width: 600px) {
            h1 { font-size: 20px; }
            .egg-card {
                flex-direction: column;
                align-items: stretch;
                text-align: center;
            }
            .btn-launch {
                background-color: rgba(208, 188, 255, 0.1);
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <header>
        <h1>WEB EGGS</h1>
    </header>

    <main id="app">
        <div class="empty-state">Сканируем репозиторий...</div>
    </main>

    <script>
        const app = document.getElementById('app');

        // Функция для определения владельца и названия репозитория из URL
        function getRepoInfo() {
            const hostname = window.location.hostname;
            const pathParts = window.location.pathname.split('/').filter(p => p);
            
            if (hostname.endsWith('.github.io')) {
                const owner = hostname.split('.')[0];
                // Если сайт на поддомене (username.github.io/repo), то репозиторий - первый кусок пути
                // Если сайт корневой (username.github.io), то репозиторий - username.github.io
                const repo = pathParts.length > 0 ? pathParts[0] : `${owner}.github.io`;
                return { owner, repo };
            }
            return null;
        }

        async function loadEggs() {
            const repoInfo = getRepoInfo();
            
            if (!repoInfo) {
                app.innerHTML = '<div class="empty-state">Это не GitHub Pages. Скрипт работает только там.</div>';
                return;
            }

            try {
                // Запрашиваем список файлов в папке eggs через GitHub API
                const apiUrl = `https://api.github.com/repos/${repoInfo.owner}/${repoInfo.repo}/contents/eggs`;
                const response = await fetch(apiUrl);
                
                if (!response.ok) throw new Error('Ошибка API');

                const files = await response.json();
                const htmlFiles = files.filter(f => f.name.endsWith('.html'));

                if (htmlFiles.length === 0) {
                    app.innerHTML = '<div class="empty-state">В папке eggs пока нет HTML файлов.</div>';
                    return;
                }

                app.innerHTML = ''; // Очищаем экран

                // Проходимся по каждому файлу, чтобы вытащить его <title>
                const eggPromises = htmlFiles.map(async (file) => {
                    try {
                        // Скачиваем сам файл, чтобы прочитать его заголовок
                        const fileRes = await fetch(file.download_url);
                        const text = await fileRes.text();
                        const titleMatch = text.match(/<title>(.*?)<\/title>/i);
                        
                        return {
                            name: file.name.replace('.html', ''),
                            title: titleMatch ? titleMatch[1] : 'Без названия',
                            url: `eggs/${file.name}` // Относительная ссылка для запуска
                        };
                    } catch (e) {
                        return { name: file.name.replace('.html', ''), title: 'Ошибка чтения', url: `eggs/${file.name}` };
                    }
                });

                // Ждем, пока прочитаются все файлы
                const eggs = await Promise.all(eggPromises);

                // Рендерим карточки
                eggs.forEach(egg => {
                    const card = document.createElement('div');
                    card.className = 'egg-card';
                    card.innerHTML = `
                        <div class="egg-info">
                            <div class="egg-filename">${escapeHTML(egg.name)}</div>
                            <div class="egg-title">${escapeHTML(egg.title)}</div>
                        </div>
                        <a href="${escapeHTML(egg.url)}" target="_blank" class="btn-launch">Запуск</a>
                    `;
                    app.appendChild(card);
                });

            } catch (error) {
                console.error(error);
                app.innerHTML = `
                    <div class="empty-state" style="color: #ffb4ab;">
                        Не удалось загрузить список.<br>
                        Убедитесь, что репозиторий публичный, а папка называется <b>eggs</b>.
                    </div>
                `;
            }
        }

        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        // Запускаем
        document.addEventListener('DOMContentLoaded', loadEggs);
    </script>
</body>
</html>
