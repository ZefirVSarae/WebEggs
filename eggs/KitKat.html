<style>
  html, body {
    margin: 0; padding: 0;
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
  }
  * {
    box-sizing: border-box;
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  .screen { position: fixed; inset: 0; }

  /* ==== PlatLogoActivity — Theme.Wallpaper.NoTitleBar.Fullscreen,
         mContent.setBackgroundColor(0xC0000000) ==== */
  #plat {
    background: rgba(0, 0, 0, 0.752941); /* 0xC0000000 over black wallpaper */
    overflow: hidden;
    touch-action: none;
    cursor: default;
  }
  .fill-wrap { position: absolute; inset: 0; }
  #plat-bg { width: 100%; height: 100%; background: #ed1d24; } /* BGCOLOR 0xffed1d24 */
  .center-wrap {
    position: absolute; left: 50%; top: 50%;
    transform: translate(-50%, -50%);
  }
  /* letter: bold, 300sp, white, Gravity.CENTER */
  #plat-letter {
    font: 700 300px/1.17 Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: #fff;
    text-align: center;
  }
  /* logo: ImageView CENTER_INSIDE, intrinsic 920x546 */
  #plat-logo {
    display: block;
    width: min(920px, 92vw);
    height: auto;
    visibility: hidden;
  }
  /* tv: light 30sp, all caps, bottom|center_horizontal, bottomMargin 10*p */
  .bottom-wrap {
    position: absolute; left: 50%; bottom: 40px;
    transform: translateX(-50%);
  }
  #plat-tv {
    font: 300 30px/1.2 Roboto, 'Helvetica Neue', Helvetica, Arial, sans-serif;
    color: #fff;
    padding: 4px; /* p = 4dp */
    text-transform: uppercase;
    white-space: nowrap;
    text-align: center;
    visibility: hidden;
  }

  /* ==== DessertCase — Theme.Black.NoTitleBar.Fullscreen ==== */
  #dessert { background: #000; display: none; }
  #dc-container { position: absolute; inset: 0; overflow: hidden; background: #000; }
  /* RescalingContainer: view laid out at 1/SCALE/2 = 2x each side => 4x screen */
  #dc-view {
    position: absolute;
    transform-origin: 50% 50%;
    will-change: transform;
  }
  .dc-cell {
    position: absolute; left: 0; top: 0;
    width: 192px; height: 192px; /* k_dessert_case_cell_size = 192dp */
    will-change: transform, opacity;
    cursor: pointer;
  }
  /* View overlay drawable with ColorMatrixColorFilter(ALPHA_MASK):
     RGB forced to white, alpha preserved -> white pastry silhouette */
  .dc-pastry {
    position: absolute; inset: 0;
    background: #fff;
    -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
    -webkit-mask-size: 100% 100%; mask-size: 100% 100%;
    pointer-events: none;
  }
</style>
</head>

  <!-- PlatLogoActivity -->
  <div id="plat" class="screen">
    <div class="fill-wrap"><div id="plat-bg"></div></div>
    <div class="center-wrap"><div id="plat-letter">K</div></div>
    <div class="center-wrap"><img id="plat-logo" alt="Android KitKat logo" draggable="false"></div>
    <div class="bottom-wrap"><div id="plat-tv">Android 4.4</div></div>
  </div>

  <!-- DessertCase -->
  <div id="dessert" class="screen">
    <div id="dc-container"><div id="dc-view"></div></div>
  </div>

/* ============================================================
 * Animation engine (mirrors android.view.ViewPropertyAnimator /
 * ObjectAnimator + ValueAnimator with rAF as the choreographer)
 * ============================================================ */
const DURATION_DEFAULT = 300; // ViewPropertyAnimator default duration

const frand  = () => Math.random();
const frandab = (a, b) => frand() * (b - a) + a;
const irand  = (a, b) => Math.trunc(frandab(a, b)); // Java (int) cast

/* android.view.animation.AccelerateInterpolator (mFactor = 1) */
const ACCEL = t => t * t;
/* android.view.animation.DecelerateInterpolator (mFactor = 1) */
const DECEL = t => 1 - (1 - t) * (1 - t);
/* android.view.animation.AccelerateDecelerateInterpolator (default) */
const ACCEL_DECEL = t => 0.5 * Math.cos((t + 1) * Math.PI) + 0.5;
/* android.view.animation.AnticipateOvershootInterpolator (mTension = 2*1.5 = 3)
   f(t) = 0.5 * a(t*2, s),           t <  0.5
   f(t) = 0.5 * (o(t*2 - 2, s) + 2), t >= 0.5   (AOSP formula) */
const aoA = (t, s) => t * t * ((s + 1) * t - s);
const aoO = (t, s) => t * t * ((s + 1) * t + s);
function ANTICIPATE_OVERSHOOT(t) {
  const s = 3.0;
  if (t < 0.5) return 0.5 * aoA(t * 2.0, s);
  return 0.5 * (aoO(t * 2.0 - 2.0, s) + 2.0);
}

const anims = new Set();
let rafId = 0;

function defaultProps() { return { x: 0, y: 0, rot: 0, sx: 1, sy: 1, alpha: 1 }; }

/* View transform order: translate(x, y) · rotate · scale around center pivot */
function applyP(el) {
  const p = el._p;
  el.style.transform =
    'translate(' + p.x + 'px,' + p.y + 'px) rotate(' + p.rot + 'deg) scale(' + p.sx + ',' + p.sy + ')';
  el.style.opacity = p.alpha;
}
function setP(el, k, v) { el._p[k] = v; applyP(el); }

function cancelAnim(a) { anims.delete(a); }

/* animate(el, targets, {duration, startDelay, interpolator, onEnd}) */
function animate(el, to, opts) {
  opts = opts || {};
  const duration = opts.duration != null ? opts.duration : DURATION_DEFAULT;
  const startDelay = opts.startDelay || 0;
  const interp = opts.interpolator || ACCEL_DECEL;
  const onEnd = opts.onEnd || null;
  // starting an animator on a property cancels the previous one (ViewPropertyAnimator semantics)
  for (const a of Array.from(anims)) {
    if (a.el === el && Object.keys(to).some(k => k in a.to)) anims.delete(a);
  }
  if (!el._p) { el._p = defaultProps(); applyP(el); }
  const from = {};
  for (const k in to) from[k] = el._p[k];
  const a = { el, to, from, start: performance.now() + startDelay, dur: duration, interp, onEnd };
  anims.add(a);
  if (!rafId) rafId = requestAnimationFrame(tick);
  return a;
}

function tick(now) {
  for (const a of Array.from(anims)) {
    if (now < a.start) continue;
    let t = (now - a.start) / a.dur;
    if (t > 1) t = 1;
    const e = a.interp(t);
    for (const k in a.to) a.el._p[k] = a.from[k] + (a.to[k] - a.from[k]) * e;
    applyP(a.el);
    if (t >= 1) {
      anims.delete(a);
      if (a.onEnd) a.onEnd();
    }
  }
  rafId = anims.size ? requestAnimationFrame(tick) : 0;
}

/* ============================================================
 * PlatLogoActivity (com.android_k.egg.PlatLogoActivity)
 * ============================================================ */
const plat    = document.getElementById('plat');
const platBg  = document.getElementById('plat-bg');
const letter  = document.getElementById('plat-letter');
const logo    = document.getElementById('plat-logo');
const tv      = document.getElementById('plat-tv');
const dessert = document.getElementById('dessert');

logo.src = IMG.k_platlogo; // R.drawable.k_platlogo, ScaleType.CENTER_INSIDE

for (const el of [platBg, letter, logo, tv]) { el._p = defaultProps(); applyP(el); }
platBg._p.alpha = 0;  platBg._p.sx = 1; applyP(platBg); // bg.setAlpha(0f)
logo._p.alpha = 0; logo._p.sx = 1; logo._p.sy = 1; applyP(logo); // INVISIBLE
tv._p.alpha = 0; applyP(tv); // INVISIBLE

let revealed = false;
let clicks = 0;

/* mContent.setOnClickListener */
function onContentClick() {
  clicks++;
  if (clicks >= 6) {
    performLongClick();
    return;
  }
  // letter.animate().cancel();
  for (const a of Array.from(anims)) if (a.el === letter) anims.delete(a);
  // final float offset = (int) letter.getRotation() % 360;
  const offset = Math.trunc(letter._p.rot) % 360;
  // letter.animate().rotationBy((Math.random() > 0.5f ? 360 : -360) - offset)
  //        .setInterpolator(new DecelerateInterpolator()).setDuration(700).start();
  const target = letter._p.rot + (Math.random() > 0.5 ? 360 : -360) - offset;
  animate(letter, { rot: target }, { duration: 700, interpolator: DECEL });
}

/* mContent.setOnLongClickListener */
function onContentLongClick() {
  if (logo.style.visibility !== 'visible') {
    reveal();
    return true;
  }
  return false;
}
function performLongClick() { onContentLongClick(); }

function reveal() {
  // bg.setScaleX(0.01f); bg.animate().alpha(1f).scaleX(1f).setStartDelay(500).start();
  platBg._p.sx = 0.01; applyP(platBg);
  animate(platBg, { alpha: 1, sx: 1 }, { duration: DURATION_DEFAULT, startDelay: 500 });
  // letter: alpha(0).scaleY(.5).scaleX(.5).rotationBy(360), Accelerate, 1000ms
  animate(letter, { alpha: 0, sx: 0.5, sy: 0.5, rot: letter._p.rot + 360 },
          { duration: 1000, interpolator: ACCEL });
  // logo VISIBLE, alpha 0, scale .5 -> 1, 1000ms, delay 500, AnticipateOvershoot
  logo.style.visibility = 'visible';
  animate(logo, { alpha: 1, sx: 1, sy: 1 },
          { duration: 1000, startDelay: 500, interpolator: ANTICIPATE_OVERSHOOT });
  // tv VISIBLE, alpha 0 -> 1, 1000ms, delay 1000
  tv.style.visibility = 'visible';
  animate(tv, { alpha: 1 }, { duration: 1000, startDelay: 1000 });
  revealed = true;
}

/* logo.setOnLongClickListener */
function onLogoLongClick() {
  // SpUtils: store the moment this user unlocked the easter egg
  try {
    if (!localStorage.getItem('k_egg_mode')) {
      localStorage.setItem('k_egg_mode', String(Date.now()));
    }
  } catch (e) { /* private mode */ }
  startDessertCase();
  return true;
}

/* ---- touch plumbing: click vs ~500ms long click (ViewConfiguration) ---- */
const LONG_PRESS_TIMEOUT = 500;
let pressTimer = null;
let suppressClick = false;

function pointInRect(e, el) {
  const r = el.getBoundingClientRect();
  return e.clientX >= r.left && e.clientX <= r.right &&
         e.clientY >= r.top  && e.clientY <= r.bottom;
}

plat.addEventListener('pointerdown', function (e) {
  suppressClick = false;
  if (pressTimer) clearTimeout(pressTimer);
  pressTimer = setTimeout(function () {
    pressTimer = null;
    suppressClick = true;
    if (logo.style.visibility === 'visible' && pointInRect(e, logo)) {
      suppressClick = onLogoLongClick();
    } else {
      suppressClick = onContentLongClick();
    }
  }, LONG_PRESS_TIMEOUT);
});
function clearPress() { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } }
plat.addEventListener('pointerup', clearPress);
plat.addEventListener('pointercancel', clearPress);
plat.addEventListener('pointerleave', clearPress);

plat.addEventListener('click', function () {
  if (suppressClick) { suppressClick = false; return; }
  onContentClick();
});
plat.addEventListener('contextmenu', e => e.preventDefault());
plat.addEventListener('dragstart', e => e.preventDefault());

const RARE_PASTRIES = [
  'k_dessert_cupcake', 'k_dessert_donut', 'k_dessert_eclair', 'k_dessert_froyo',
  'k_dessert_gingerbread', 'k_dessert_honeycomb', 'k_dessert_ics', 'k_dessert_jellybean'
];
const XRARE_PASTRIES = [
  'k_dessert_petitfour', 'k_dessert_donutburger', 'k_dessert_flan', 'k_dessert_keylimepie'
];
const XXRARE_PASTRIES = [
  'k_dessert_zombiegingerbread', 'k_dessert_dandroid', 'k_dessert_jandycane'
];

const PROB_2X = 0.33, PROB_3X = 0.1, PROB_4X = 0.01;

function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

/* float[] hsv = {0, 1f, .85f}; 12 hues */
function randomColor() {
  const COLORS = 12;
  const h = irand(0, COLORS) * (360 / COLORS);
  const s = 1, v = 0.85;
  const c = v * s, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = v - c;
  let r, g, b;
  if (h < 60)       { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else              { r = c; g = 0; b = x; }
  const f = n => Math.round((n + m) * 255);
  return 'rgb(' + f(r) + ',' + f(g) + ',' + f(b) + ')';
}

const dcContainer = document.getElementById('dc-container');
const dcView = document.getElementById('dc-view');

let mStarted = false;
let mRows = 0, mColumns = 0;
let mCells = [];        // View[] mCells
let cellEls = [];       // live children (getChildCount)
const mFreeList = new Map(); // Set<Point> mFreeList, keyed "x,y"
let juggleTimer = null;
let startTimer = null;

function getOccupied(v) {
  const scale = v._span, pt = v._pos;
  if (!pt || !scale) return [];
  const res = [];
  for (let i = 0; i < scale; i++)
    for (let j = 0; j < scale; j++)
      res.push({ x: pt.x + i, y: pt.y + j });
  return res;
}

/* onSizeChanged: rebuild grid, fix scale + centering (issue #349 fix) */
function onSizeChanged() {
  const w = dcContainer.clientWidth, h = dcContainer.clientHeight;
  const vw = 4 * w, vh = 4 * h; // RescalingContainer.layout: w / SCALE / 2 per side
  dcView.style.width = vw + 'px';
  dcView.style.height = vh + 'px';
  dcView.style.left = (w / 2 - vw / 2) + 'px';   // cx - w2
  dcView.style.top  = (h / 2 - vh / 2) + 'px';   // cy - h2

  mColumns = Math.floor(vw / CELL);
  mRows = Math.floor(vh / CELL);

  const wasStarted = mStarted;
  if (wasStarted) stopView();

  mCells = new Array(mRows * mColumns).fill(null);
  for (const c of cellEls) c.remove();
  cellEls = [];
  mFreeList.clear();
  for (let j = 0; j < mRows; j++)
    for (let i = 0; i < mColumns; i++)
      mFreeList.set(i + ',' + j, { x: i, y: j });

  const scaleS = (vw > 0 && vh > 0)
    ? Math.max(vw / (CELL * mColumns), vh / (CELL * mRows)) : 1;
  const scale = VIEW_SCALE * scaleS;
  const tx = 0.5 * (vw - CELL * mColumns) * scale;
  const ty = 0.5 * (vh - CELL * mRows) * scale;
  dcView.style.transform = 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';

  if (wasStarted) startView();
}

function makeCell() {
  const v = document.createElement('div');
  v.className = 'dc-cell';
  v._p = defaultProps(); applyP(v);
  v._pos = null; v._span = 1;

  v.addEventListener('click', function () {
    // place(v, true); postDelayed({ fillFreeList(); }, DURATION / 2);
    place(v, { x: irand(0, mColumns), y: irand(0, mRows) }, true);
    setTimeout(function () { fillFreeList(); }, DURATION / 2);
  });

  v.style.backgroundColor = randomColor();

  const which = frand();
  let d = null;
  if (which < 0.0005)      d = pick(XXRARE_PASTRIES);
  else if (which < 0.005)  d = pick(XRARE_PASTRIES);
  else if (which < 0.5)    d = pick(RARE_PASTRIES);
  else if (which < 0.7)    d = pick(PASTRIES);
  if (d) {
    const o = document.createElement('div');
    o.className = 'dc-pastry';
    const url = 'url("' + IMG[d] + '")';
    o.style.webkitMaskImage = url;
    o.style.maskImage = url;
    v.appendChild(o); // v.getOverlay().add(d)
  }
  return v;
}

/* synchronized place(View v, Point pt, boolean animate) */
function place(v, pt, animateFlag) {
  const i = pt.x, j = pt.y;
  const rnd = frand();

  if (v._pos) {
    for (const oc of getOccupied(v)) {
      mFreeList.set(oc.x + ',' + oc.y, oc);
      mCells[oc.y * mColumns + oc.x] = null;
    }
  }

  let scale = 1;
  if (rnd < PROB_4X) {
    if (!(i >= mColumns - 3 || j >= mRows - 3)) scale = 4;
  } else if (rnd < PROB_3X) {
    if (!(i >= mColumns - 2 || j >= mRows - 2)) scale = 3;
  } else if (rnd < PROB_2X) {
    if (!(i === mColumns - 1 || j === mRows - 1)) scale = 2;
  }

  v._pos = { x: i, y: j };
  v._span = scale;

  const squatters = new Set();
  const occupied = getOccupied(v);
  for (const oc of occupied) {
    const s = mCells[oc.y * mColumns + oc.x];
    if (s) squatters.add(s);
  }

  for (const sq of squatters) {
    for (const p of getOccupied(sq)) {
      mFreeList.set(p.x + ',' + p.y, p);
      mCells[p.y * mColumns + p.x] = null;
    }
    if (sq !== v) {
      sq._pos = null; // squatter.setTag(TAG_POS, null)
      if (animateFlag) {
        animate(sq, { sx: 0.5, sy: 0.5, alpha: 0 },
                { duration: DURATION, interpolator: ACCEL, onEnd: function () { removeView(sq); } });
      } else {
        removeView(sq);
      }
    }
  }

  for (const oc of occupied) {
    mCells[oc.y * mColumns + oc.x] = v;
    mFreeList.delete(oc.x + ',' + oc.y);
  }

  const rot = irand(0, 4) * 90;

  if (animateFlag) {
    dcView.appendChild(v); // v.bringToFront()

    // set1: scale, AnticipateOvershoot, DURATION
    animate(v, { sx: scale, sy: scale },
            { duration: DURATION, interpolator: ANTICIPATE_OVERSHOOT });
    // set2: rotation + X + Y, DecelerateInterpolator, DURATION
    animate(v, {
      rot: rot,
      x: i * CELL + (scale - 1) * CELL / 2,
      y: j * CELL + (scale - 1) * CELL / 2
    }, { duration: DURATION, interpolator: DECEL });
  } else {
    setP(v, 'x', i * CELL + (scale - 1) * CELL / 2);
    setP(v, 'y', j * CELL + (scale - 1) * CELL / 2);
    setP(v, 'sx', scale); setP(v, 'sy', scale);
    setP(v, 'rot', rot);
  }
}

function removeView(v) {
  const idx = cellEls.indexOf(v);
  if (idx >= 0) cellEls.splice(idx, 1);
  if (v.isConnected) v.remove();
  if (v._pos) {
    for (const oc of getOccupied(v)) {
      mFreeList.set(oc.x + ',' + oc.y, oc);
      mCells[oc.y * mColumns + oc.x] = null;
    }
    v._pos = null;
  }
}

/* synchronized fillFreeList(int animationLen) */
function fillFreeList(animationLen) {
  if (animationLen == null) animationLen = DURATION;
  while (mFreeList.size > 0) {
    const key = mFreeList.keys().next().value;
    const pt = mFreeList.get(key);
    mFreeList.delete(key);
    const i = pt.x, j = pt.y;
    if (mCells[j * mColumns + i]) continue;

    const v = makeCell();
    cellEls.push(v);
    dcView.appendChild(v);

    place(v, pt, false);
    if (animationLen > 0) {
      const s = v._span;
      setP(v, 'sx', 0.5 * s); setP(v, 'sy', 0.5 * s);
      setP(v, 'alpha', 0);
      animate(v, { sx: s, sy: s, alpha: 1 }, { duration: animationLen });
    }
  }
}

/* mJuggle */
function juggle() {
  const N = cellEls.length;
  const K = 1; // irand(1,3) -> constant 1
  for (let i = 0; i < K; i++) {
    if (N > 0) {
      const child = cellEls[Math.floor(Math.random() * N)];
      if (child && child.isConnected) place(child, { x: irand(0, mColumns), y: irand(0, mRows) }, true);
    }
  }
  fillFreeList();
  if (mStarted) juggleTimer = setTimeout(juggle, DELAY);
}

/* start() / stop() */
function startView() {
  if (!mStarted) {
    mStarted = true;
    fillFreeList(DURATION * 4);
  }
  juggleTimer = setTimeout(juggle, START_DELAY);
}
function stopView() {
  mStarted = false;
  if (juggleTimer) { clearTimeout(juggleTimer); juggleTimer = null; }
}

/* ============================================================
 * DessertCase activity lifecycle
 * ============================================================ */
let dessertOn = false;

function startDessertCase() {
  dessertOn = true;
  plat.style.display = 'none';
  dessert.style.display = 'block';
  onSizeChanged();
  // mView.postDelayed(action, 1000) in onResume
  startTimer = setTimeout(startView, 1000);
}

document.addEventListener('visibilitychange', function () {
  if (!dessertOn) return;
  if (document.hidden) {
    if (startTimer) { clearTimeout(startTimer); startTimer = null; } // removeCallbacks(action)
    stopView();
  } else {
    startTimer = setTimeout(startView, 1000);
  }
});

window.addEventListener('resize', function () {
  if (dessertOn) onSizeChanged(); // DessertCaseView.onSizeChanged
});
</script>
