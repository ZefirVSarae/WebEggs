var longPressTimer = null;
var longPressed    = false;

/* tv.setText("Android 4." + (new Random().nextInt(3) + 1)); */
var jellyVersion = 1 + Math.floor(Math.random() * 3);
toastVer.textContent = "Android 4." + jellyVersion;

function showToast() {
  toast.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(function () { toast.classList.remove("show"); }, 2300); /* LENGTH_LONG */
}

/* onClick -> mToast.show(); mContent.setImageResource(R.drawable.j_platlogo); */
platScreen.addEventListener("pointerdown", function () {
  longPressed = false;
  longPressTimer = setTimeout(function () {
    longPressed = true;
    startBeanBag();                       /* onLongClick -> BeanBag */
  }, 550);
});
platScreen.addEventListener("pointerup", function () {
  clearTimeout(longPressTimer);
  if (!longPressed) {
    showToast();
    platImg.src = PLATLOGO;
  }
});
platScreen.addEventListener("pointerleave", function () { clearTimeout(longPressTimer); });
platScreen.addEventListener("contextmenu", function (e) { e.preventDefault(); });

var beanbagScreen = document.getElementById("beanbag-screen");
var board = document.getElementById("board");
var ctx = board.getContext("2d");

var sRNG = Math.random;
function lerp(a, b, f) { return (b - a) * f + a; }
function randfrange(a, b) { return lerp(a, b, sRNG()); }
function randsign() { return sRNG() < 0.5 ? 1 : -1; }
function flip() { return sRNG() < 0.5; }
function mag(x, y) { return Math.sqrt(x * x + y * y); }
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function pickInt(arr) { return arr[Math.floor(sRNG() * arr.length)]; }

var sprites = {};   /* key: beanIdx + "_" + colorIdx -> canvas */

/* ColorMatrix tint: we assume the color information is in the red channel
   (M[0]=R, M[5]=G, M[10]=B applied to the source pixel channels). */
function buildSprite(beanIdx, colorIdx) {
  var img = BEAN_IMGS[beanIdx];
  var c = document.createElement("canvas");
  c.width = img.width; c.height = img.height;
  var g = c.getContext("2d");
  g.drawImage(img, 0, 0);
  var col = COLORS[colorIdx];
  var id = g.getImageData(0, 0, c.width, c.height);
  var px = id.data;
  for (var i = 0; i < px.length; i += 4) {
    /* shape/luminance lives in the red channel — project it onto the color */
    var lum = px[i];
    px[i]     = lum * col[0] / 0xFF;
    px[i + 1] = lum * col[1] / 0xFF;
    px[i + 2] = lum * col[2] / 0xFF;
  }
  g.putImageData(id, 0, 0);
  return c;
}

var boardWidth = 0, boardHeight = 0;
var beans = [];
var lastFrame = 0;
var running = false;
var grabbedBean = null;
var grabx_offset = 0, graby_offset = 0;
var grabx = 0, graby = 0;

function Bean() {
  this.pickBean();
  this.z = 0;
  this.reset();
}

Bean.prototype.pickBean = function () {
  var beanIdx = pickInt(BEANS);
  if (randfrange(0, 1) <= LUCKY) {
    beanIdx = -1;                        /* j_jandycane — never tinted */
    this.img = CANDY_IMG;
    this.sprite = CANDY_IMG;
  } else {
    this.img = BEAN_IMGS[beanIdx];
    var colorIdx = Math.floor(sRNG() * COLORS.length);
    var key = beanIdx + "_" + colorIdx;
    if (!sprites[key]) sprites[key] = buildSprite(beanIdx, colorIdx);
    this.sprite = sprites[key];
  }
  this.h = this.img.height;
  this.w = this.img.width;
};

Bean.prototype.reset = function () {
  var scale = lerp(MIN_SCALE, MAX_SCALE, this.z);
  this.scale = scale;
  this.r = 0.3 * Math.max(this.h, this.w) * scale;

  this.a = randfrange(0, 360);
  this.va = randfrange(-30, 30);

  this.vx = randfrange(-40, 40) * this.z;
  this.vy = randfrange(-40, 40) * this.z;

  if (flip()) {
    this.x = (this.vx < 0 ? boardWidth + 2 * this.r : -this.r * 4);
    this.y = randfrange(0, boardHeight - 3 * this.r) * 0.5 +
             ((this.vy < 0) ? boardHeight * 0.5 : 0);
  } else {
    this.y = (this.vy < 0 ? boardHeight + 2 * this.r : -this.r * 4);
    this.x = randfrange(0, boardWidth - 3 * this.r) * 0.5 +
             ((this.vx < 0) ? boardWidth * 0.5 : 0);
  }
};

Bean.prototype.update = function (dt) {
  if (this.grabbed) {
    this.vx = (this.vx * 0.75) + ((grabx - this.x) / dt) * 0.25;
    this.x = grabx;
    this.vy = (this.vy * 0.75) + ((graby - this.y) / dt) * 0.25;
    this.y = graby;
  } else {
    this.x += this.vx * dt;
    this.y += this.vy * dt;
    this.a += this.va * dt;
  }
};

/* filter touch events for transparent pixels (isTouchedBean) */
Bean.prototype.hitTest = function (px, py) {
  /* px, py are SIM coords relative to bean center */
  var rot = -this.a * Math.PI / 180;
  var dx = px - this.x, dy = py - this.y;
  var lx = dx * Math.cos(rot) - dy * Math.sin(rot) + this.w * this.scale / 2;
  var ly = dx * Math.sin(rot) + dy * Math.cos(rot) + this.h * this.scale / 2;
  var sx = this.w * this.scale, sy = this.h * this.scale;
  if (lx < 0 || ly < 0 || lx >= sx || ly >= sy) return false;
  var img = this.img;
  var bx = Math.floor(lx / this.scale * (img.width / this.w));
  var by = Math.floor(ly / this.scale * (img.height / this.h));
  if (!img.alphaData) {
    var c = document.createElement("canvas");
    c.width = img.width; c.height = img.height;
    var g = c.getContext("2d");
    g.drawImage(img, 0, 0);
    img.alphaData = g.getImageData(0, 0, c.width, c.height).data;
  }
  return img.alphaData[(by * img.width + bx) * 4 + 3] > 0;
};

function resizeBoard() {
  var dpr = window.devicePixelRatio || 1;
  var cssW = beanbagScreen.clientWidth, cssH = beanbagScreen.clientHeight;
  board.width = Math.round(cssW * dpr);
  board.height = Math.round(cssH * dpr);
  ctx.setTransform(dpr * cssW / (cssW * D), 0, 0, dpr * cssH / (cssH * D), 0, 0);
  /* equivalent to: scale = dpr / D */
  ctx.setTransform(dpr / D, 0, 0, dpr / D, 0, 0);
  boardWidth = cssW * D;
  boardHeight = cssH * D;
}
window.addEventListener("resize", resizeBoard);

function frame(t) {
  if (!running) return;
  var dt = Math.min((t - lastFrame) / 1000, 0.05);
  lastFrame = t;

  for (var i = 0; i < beans.length; i++) {
    var nv = beans[i];
    nv.update(dt);
    if (nv.x < -MAX_RADIUS || nv.x > boardWidth + MAX_RADIUS ||
        nv.y < -MAX_RADIUS || nv.y > boardHeight + MAX_RADIUS) {
      nv.reset();
    }
  }

  ctx.clearRect(0, 0, boardWidth, boardHeight);
  for (var i = 0; i < beans.length; i++) {
    var b = beans[i];
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.a * Math.PI / 180);
    ctx.scale(b.scale, b.scale);
    ctx.drawImage(b.sprite, -b.w / 2, -b.h / 2, b.w, b.h);
    ctx.restore();
  }
  requestAnimationFrame(frame);
}

function resetBoard() {
  beans = [];
  for (var i = 0; i < NUM_BEANS; i++) {
    var nv = new Bean();
    nv.z = i / NUM_BEANS;
    nv.z *= nv.z;
    nv.pickBean();          /* pickBean() inside reset() in Java */
    nv.reset();
    nv.x = randfrange(0, boardWidth);
    nv.y = randfrange(0, boardHeight);
    beans.push(nv);
  }
}

/* ----- touch handling (onTouchEvent) ----- */
function toSim(e) {
  var rect = board.getBoundingClientRect();
  return { x: (e.clientX - rect.left) * D, y: (e.clientY - rect.top) * D };
}
board.addEventListener("pointerdown", function (e) {
  var p = toSim(e);
  for (var i = beans.length - 1; i >= 0; i--) {
    var b = beans[i];
    if (b.hitTest(p.x, p.y)) {
      grabbedBean = b;
      b.grabbed = true;
      grabx_offset = p.x - b.x;
      graby_offset = p.y - b.y;
      b.va = 0;
      grabx = b.x; graby = b.y;
      beanbagScreen.classList.add("grabbing");
      board.setPointerCapture(e.pointerId);
      break;
    }
  }
});
board.addEventListener("pointermove", function (e) {
  if (!grabbedBean) return;
  var p = toSim(e);
  grabx = p.x - grabx_offset;
  graby = p.y - graby_offset;
});
function releaseGrab(e) {
  if (!grabbedBean) return;
  grabbedBean.grabbed = false;
  /* ACTION_UP: va = randfrange(a*0.5, a), a = randsign()*clamp(mag(vx,vy)*0.33, 0, 1080) */
  var a = randsign() * clamp(mag(grabbedBean.vx, grabbedBean.vy) * 0.33, 0, 1080);
  grabbedBean.va = randfrange(a * 0.5, a);
  grabbedBean = null;
  beanbagScreen.classList.remove("grabbing");
}
board.addEventListener("pointerup", releaseGrab);
board.addEventListener("pointercancel", releaseGrab);

function startBeanBag() {
  platScreen.style.display = "none";
  beanbagScreen.style.display = "block";
  resizeBoard();
  resetBoard();
  running = true;
  lastFrame = performance.now();
  requestAnimationFrame(frame);
}
</script>
</body>
</html>
